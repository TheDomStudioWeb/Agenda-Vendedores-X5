<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>X5 Check · Checklist Vehicular</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="x5-theme.css">
<script src="libs/docx.min.js"></script>
<style>
  body { padding-bottom: calc(90px + var(--safe-bottom)); }
  .cat { margin-top: 14px; }
  .cat-h { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .cat-h .num { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--x5-soft); color: var(--x5); font-weight: 800; font-size: .8rem; }
  .cat-h h2 { margin: 0; font-size: .92rem; font-weight: 700; flex: 1; }
  .it { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .it:last-child { border-bottom: 0; }
  .it-name { font-weight: 600; font-size: .9rem; margin-bottom: 8px; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .opts input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .opts label { display: grid; place-items: center; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); font-weight: 700; font-size: .84rem; color: var(--muted); cursor: pointer; transition: all .15s; }
  .opts input:checked + label.B { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .opts input:checked + label.R { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .opts input:checked + label.M { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .opts input:checked + label.NA { background: var(--surface-3); color: var(--text); border-color: var(--line-strong); }
  .obs { margin-top: 8px; }
  .obs.req { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .photos div { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--surface-3) center/cover; }
  .photos button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: .75rem; cursor: pointer; }
  .sig-wrap { position: relative; border-radius: 14px; overflow: hidden; border: 1.5px dashed var(--line-strong); background: #fff; }
  #firma { display: block; width: 100%; height: 170px; touch-action: none; }
  .sig-wrap span { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: #b5bcc6; font-size: .78rem; pointer-events: none; border-top: 1px solid #e3e7ec; margin: 0 24px; padding-top: 4px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 16px calc(10px + var(--safe-bottom)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .dock .sum { display: flex; gap: 6px; flex-wrap: wrap; }
  .dock .btn { width: auto; flex: 1; }
</style>
</head>
<body>
<header class="x5-top">
  <a class="x5-back" href="index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div><h1>X5 Check</h1><div class="sub">Peritaje y recepción de unidades</div></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm" id="btn-nuevo" type="button">Nuevo</button>
</header>

<main class="x5-wrap">
<form id="form" autocomplete="off">
  <section class="card">
    <div class="card-title"><span><span class="dot"></span>Datos de la unidad</span><span class="chip" id="borrador" hidden>Borrador guardado</span></div>
    <div class="row"><div class="field"><label for="fecha">Fecha</label><input type="date" id="fecha" name="fecha" required></div>
      <div class="field"><label for="tipo">Inspección</label><select id="tipo" name="tipo"><option>Control Semanal</option><option>Recepción Cliente</option><option>Recepción Empresa</option></select></div></div>
    <div class="row"><div class="field"><label for="marca">Marca</label><input id="marca" name="marca" placeholder="Toyota"></div>
      <div class="field"><label for="modelo">Modelo</label><input id="modelo" name="modelo" placeholder="Corolla Cross"></div></div>
    <div class="row"><div class="field"><label for="dominio">Dominio</label><input id="dominio" name="dominio" placeholder="AB123CD" required style="text-transform:uppercase"></div>
      <div class="field"><label for="color">Color</label><input id="color" name="color" placeholder="Gris plata"></div></div>
    <div class="row"><div class="field"><label for="km">Kilometraje</label><input id="km" name="km" inputmode="numeric" placeholder="45000"></div>
      <div class="field"><label for="combustible">Combustible</label><select id="combustible" name="combustible"><option>Reserva</option><option>1/4 Tanque</option><option selected>1/2 Tanque</option><option>3/4 Tanque</option><option>Full / Lleno</option></select></div></div>
    <div class="field" style="margin:0"><label for="responsable">Responsable de la inspección</label><input id="responsable" name="responsable" placeholder="Tu nombre"></div>
  </section>

  <section class="card">
    <div class="muted" style="font-size:.78rem">B = Bueno · R = Regular · M = Malo · N/A = No aplica. <b style="color:var(--bad)">R y M exigen observación.</b></div>
    <div id="checklist"></div>
  </section>

  <section class="card">
    <div class="card-title"><span><span class="dot"></span>Evidencia fotográfica</span><span class="chip" id="n-fotos">0</span></div>
    <div class="row">
      <label class="btn btn-ghost">📷 Cámara<input type="file" id="in-cam" accept="image/*" capture="environment" hidden></label>
      <label class="btn btn-ghost">🖼 Galería<input type="file" id="in-gal" accept="image/*" multiple hidden></label>
    </div>
    <div class="photos" id="photos"></div>
  </section>

  <section class="card">
    <div class="card-title"><span><span class="dot"></span>Conformidad y firma</span><button type="button" class="btn btn-ghost btn-sm" id="btn-borrar-firma">Borrar</button></div>
    <div class="field"><label for="firmante">Nombre de quien firma</label><input id="firmante" name="firmante" placeholder="Cliente / entregador"></div>
    <div class="sig-wrap"><canvas id="firma"></canvas><span>Firmá dentro del recuadro</span></div>
  </section>
</form>
</main>

<div class="dock">
  <div class="sum" id="sum"></div>
  <button class="btn" id="btn-generar" type="button">Generar DOCX</button>
</div>

<script src="x5-core.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const CATS = [
  ['Documentación', [['doc_cedula', 'Cédula verde / azul'], ['doc_seguro', 'Seguro / VTV / manuales']]],
  ['Exterior y carrocería', [['ext_pintura', 'Pintura / rayones / bollos'], ['ext_cristales', 'Cristales y parabrisas'], ['ext_neumaticos', 'Neumáticos y llantas']]],
  ['Sistema eléctrico y luces', [['elec_luces', 'Luces altas / bajas / posición'], ['elec_giro', 'Giros, stop y reversa']]],
  ['Interior y confort', [['int_tapizado', 'Tapizados y alfombras'], ['int_clima', 'Aire acondicionado / calefacción'], ['int_multimedia', 'Radio / multimedia / tablero']]],
  ['Mecánica y fluidos', [['mec_aceite', 'Nivel de aceite / fluidos']]],
  ['Seguridad y accesorios', [['seg_auxilio', 'Rueda de auxilio / herramientas'], ['seg_matafuegos', 'Matafuegos y balizas']]]
];
const OPTS = [['B', 'B'], ['R', 'R'], ['M', 'M'], ['NA', 'N/A']];

$('checklist').innerHTML = CATS.map(([titulo, items], ci) => `
  <div class="cat"><div class="cat-h"><span class="num">${ci + 1}</span><h2>${titulo}</h2></div>
  ${items.map(([id, nombre]) => `
    <div class="it"><div class="it-name">${nombre}</div>
      <div class="opts">${OPTS.map(([v, t]) => `<input type="radio" name="${id}" id="${id}_${v}" value="${v}" ${v === 'B' ? 'checked' : ''}><label for="${id}_${v}" class="${v}">${t}</label>`).join('')}</div>
      <input class="obs" name="obs_${id}" placeholder="Observaciones…">
    </div>`).join('')}</div>`).join('');

/* ── Observación obligatoria + resumen ───────────────────── */
function evaluar() {
  let r = 0, m = 0, faltan = 0;
  CATS.forEach(([, its]) => its.forEach(([id]) => {
    const v = (document.querySelector(`input[name="${id}"]:checked`) || {}).value;
    const obs = document.querySelector(`[name="obs_${id}"]`);
    const req = v === 'R' || v === 'M';
    obs.classList.toggle('req', req && !obs.value.trim());
    obs.placeholder = req ? 'Detalle obligatorio…' : 'Observaciones…';
    if (v === 'R') r++; if (v === 'M') m++; if (req && !obs.value.trim()) faltan++;
  }));
  $('sum').innerHTML = (r ? `<span class="chip warn">${r} R</span>` : '') + (m ? `<span class="chip bad">${m} M</span>` : '') + (!r && !m ? '<span class="chip ok">Todo OK</span>' : '');
  return { r, m, faltan };
}
$('form').addEventListener('change', () => { evaluar(); guardarBorrador(); });
$('form').addEventListener('input', (e) => { if (e.target.classList.contains('obs')) evaluar(); guardarBorrador(); });

/* ── Borrador (no se pierde si se cierra la app) ─────────── */
let tBorr;
function guardarBorrador() {
  clearTimeout(tBorr);
  tBorr = setTimeout(() => {
    try { localStorage.setItem('x5_check_borrador', JSON.stringify(Object.fromEntries(new FormData($('form'))))); $('borrador').hidden = false; } catch (e) {}
  }, 500);
}
function restaurarBorrador() {
  try {
    const d = JSON.parse(localStorage.getItem('x5_check_borrador') || 'null'); if (!d) return false;
    Object.entries(d).forEach(([k, v]) => {
      const radio = document.querySelector(`input[type=radio][name="${k}"][value="${CSS.escape(v)}"]`);
      if (radio) radio.checked = true; else { const el = document.querySelector(`[name="${k}"]`); if (el) el.value = v; }
    });
    $('borrador').hidden = false; return true;
  } catch (e) { return false; }
}
function limpiar() {
  $('form').reset(); $('fecha').value = X5.hoyISO();
  try { localStorage.removeItem('x5_check_borrador'); } catch (e) {}
  fotos.forEach(f => URL.revokeObjectURL(f.url)); fotos = []; pintarFotos(); borrarFirma();
  $('responsable').value = localStorage.getItem('x5_check_resp') || '';
  $('borrador').hidden = true; evaluar(); window.scrollTo(0, 0);
}
$('btn-nuevo').addEventListener('click', () => { if (confirm('¿Empezar un checklist nuevo? Se borra lo cargado.')) limpiar(); });

/* ── Fotos (comprimidas: el DOCX pasa de ~40 MB a ~3 MB) ─── */
let fotos = [];
async function agregarFotos(files) {
  for (const f of files) {
    try { const c = await X5.comprimir(f, 1400, 0.78); fotos.push({ ...c, url: URL.createObjectURL(c.blob) }); }
    catch (e) { X5.toast('No se pudo leer una foto', 'bad'); }
  }
  pintarFotos();
}
function pintarFotos() {
  $('n-fotos').textContent = fotos.length;
  $('photos').innerHTML = fotos.map((f, i) => `<div style="background-image:url(${f.url})"><button type="button" data-i="${i}" aria-label="Quitar">✕</button></div>`).join('');
}
$('photos').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const [x] = fotos.splice(+b.dataset.i, 1); URL.revokeObjectURL(x.url); pintarFotos(); });
['in-cam', 'in-gal'].forEach(id => $(id).addEventListener('change', (e) => { const f = [...e.target.files]; e.target.value = ''; agregarFotos(f); }));

/* ── Firma nítida (alta densidad, mouse/dedo/lápiz) ──────── */
const cv = $('firma'), g = cv.getContext('2d');
let firmado = false, dibujando = false, last = null;
function ajustarFirma() {
  const r = cv.getBoundingClientRect(), dpr = Math.max(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0d1b2a';
  firmado = false;
}
const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); dibujando = true; last = pos(e); firmado = true; });
cv.addEventListener('pointermove', (e) => {
  if (!dibujando) return;
  const p = pos(e), mid = [(last[0] + p[0]) / 2, (last[1] + p[1]) / 2];
  g.beginPath(); g.moveTo(last[0], last[1]); g.quadraticCurveTo(last[0], last[1], mid[0], mid[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p;
});
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => dibujando = false));
function borrarFirma() { g.clearRect(0, 0, cv.width, cv.height); firmado = false; }
$('btn-borrar-firma').addEventListener('click', borrarFirma);

/* ── DOCX ────────────────────────────────────────────────── */
const AZUL = '0B6E8A', DORADO = 'A8841F';
const colorEstado = { B: '12A066', R: 'C98A0E', M: 'D93A3A', NA: '777777' };
const txtEstado = { B: 'Bueno', R: 'Regular', M: 'Malo', NA: 'N/A' };

$('btn-generar').addEventListener('click', async () => {
  const form = $('form');
  if (!form.reportValidity()) return;
  const ev = evaluar();
  if (ev.faltan) { X5.toast(`Faltan ${ev.faltan} observación(es) obligatoria(s)`, 'bad'); document.querySelector('.obs.req')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const btn = $('btn-generar'); btn.disabled = true; btn.textContent = 'Generando…';
  try {
    const d = Object.fromEntries(new FormData(form));
    try { localStorage.setItem('x5_check_resp', d.responsable || ''); } catch (e) {}
    const D = docx;
    const P = (text, o = {}) => new D.Paragraph({ children: [new D.TextRun({ text, ...o })], ...(o.p || {}) });
    const celda = (children, o = {}) => new D.TableCell({ children, margins: { top: 80, bottom: 80, left: 100, right: 100 }, ...o });
    const hijos = [
      P('REPORTE DE CHECKLIST VEHICULAR', { bold: true, size: 32, color: AZUL, p: { alignment: D.AlignmentType.CENTER } }),
      P('X5 ARGENTINA · SUCURSAL MENDOZA (San Martín 2417)', { bold: true, size: 20, color: DORADO, p: { alignment: D.AlignmentType.CENTER, spacing: { after: 300 } } }),
      new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [
        ['Fecha', X5.fechaLarga(d.fecha), 'Inspección', d.tipo],
        ['Vehículo', `${d.marca || 'N/D'} ${d.modelo || ''}`.trim(), 'Color', d.color || 'N/D'],
        ['Dominio', String(d.dominio).toUpperCase(), 'Kilometraje', d.km ? Number(String(d.km).replace(/\D/g, '')).toLocaleString('es-AR') + ' km' : 'N/D'],
        ['Combustible', d.combustible, 'Responsable', d.responsable || 'N/D']
      ].map(r => new D.TableRow({ children: r.map((t, i) => celda([P(t, { bold: i % 2 === 0, size: 20, color: i % 2 === 0 ? '555555' : '111111' })], i % 2 === 0 ? { shading: { fill: 'EEF3F6' } } : {})) })) }),
      P(`Resumen: ${ev.r} ítem(s) regular(es) · ${ev.m} ítem(s) en mal estado`, { bold: true, size: 20, color: ev.m ? colorEstado.M : ev.r ? colorEstado.R : colorEstado.B, p: { spacing: { before: 200 } } })
    ];
    CATS.forEach(([titulo, items], ci) => {
      hijos.push(P(`${ci + 1}. ${titulo}`, { bold: true, size: 26, color: AZUL, p: { spacing: { before: 300, after: 100 } } }));
      const head = new D.TableRow({ tableHeader: true, children: ['Ítem evaluado', 'Estado', 'Observaciones'].map((t, i) => celda([P(t, { bold: true, size: 20, color: 'FFFFFF' })], { shading: { fill: AZUL }, width: { size: [42, 14, 44][i], type: D.WidthType.PERCENTAGE } })) });
      const filas = items.map(([id, nombre]) => new D.TableRow({ children: [
        celda([P(nombre, { size: 20 })]),
        celda([P(txtEstado[d[id]] || d[id], { bold: true, size: 20, color: colorEstado[d[id]] || '111111', p: { alignment: D.AlignmentType.CENTER } })]),
        celda([P(d['obs_' + id] || '—', { size: 20 })])
      ] }));
      hijos.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [head, ...filas] }));
    });
    if (fotos.length) {
      hijos.push(P(`${CATS.length + 1}. Evidencia fotográfica`, { bold: true, size: 26, color: AZUL, p: { spacing: { before: 300, after: 150 } } }));
      const filas = [];
      for (let i = 0; i < fotos.length; i += 2) {
        const celdaFoto = async (f) => {
          if (!f) return celda([P('')]);
          const k = Math.min(270 / f.width, 200 / f.height);
          return celda([new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.ImageRun({ data: await f.blob.arrayBuffer(), transformation: { width: Math.round(f.width * k), height: Math.round(f.height * k) } })] })]);
        };
        filas.push(new D.TableRow({ children: [await celdaFoto(fotos[i]), await celdaFoto(fotos[i + 1])] }));
      }
      hijos.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: filas }));
    }
    hijos.push(P(`${CATS.length + (fotos.length ? 2 : 1)}. Conformidad`, { bold: true, size: 26, color: AZUL, p: { spacing: { before: 400, after: 100 } } }));
    if (firmado) {
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const ratio = cv.height / cv.width;
      hijos.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.ImageRun({ data: await blob.arrayBuffer(), transformation: { width: 340, height: Math.round(340 * ratio) } })] }));
      hijos.push(P(d.firmante || 'Firma digital', { size: 20, p: { alignment: D.AlignmentType.CENTER } }));
    } else {
      hijos.push(P('_______________________________', { p: { spacing: { before: 600 }, alignment: D.AlignmentType.CENTER } }));
      hijos.push(P(d.firmante ? `${d.firmante} · firma física pendiente` : 'Firma física pendiente', { size: 20, p: { alignment: D.AlignmentType.CENTER } }));
    }
    const doc = new D.Document({ creator: 'X5 Cuyo · Hub Comercial', title: 'Checklist ' + d.dominio, sections: [{ properties: { page: { margin: { top: 900, bottom: 900, left: 900, right: 900 } } }, children: hijos }] });
    const blob = await D.Packer.toBlob(doc);
    const nombre = `Checklist_${X5.slug(String(d.dominio).toUpperCase())}_${d.fecha}.docx`;
    if (X5.puedeCompartir(blob, nombre) && confirm('Documento listo. ¿Compartirlo ahora? (Cancelar = solo guardar)')) await X5.compartirArchivo(blob, nombre, 'Checklist ' + d.dominio);
    else { await X5.guardarArchivo(blob, nombre); X5.toast('Checklist guardado', 'ok'); }
    try { localStorage.removeItem('x5_check_borrador'); } catch (e) {}
    $('borrador').hidden = true;
  } catch (e) {
    console.error(e); X5.toast('Error al generar el documento: ' + e.message, 'bad', 4000);
  } finally { btn.disabled = false; btn.textContent = 'Generar DOCX'; }
});

/* ── Inicio ──────────────────────────────────────────────── */
$('fecha').value = X5.hoyISO();
if (!restaurarBorrador()) $('responsable').value = localStorage.getItem('x5_check_resp') || '';
requestAnimationFrame(ajustarFirma);
window.addEventListener('resize', () => { if (!firmado) ajustarFirma(); });
evaluar();
})();
</script>
</body>
</html>
