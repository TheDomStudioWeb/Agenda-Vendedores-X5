<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>X5 Cuyo · Radar de Usados</title>
<meta name="theme-color" content="#161618">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../x5-theme.css">
<style>
  /* Radar de Usados — herramienta del Hub (los datos de /data nunca se guardan en la caché de la app). */
  .x5-wrap { max-width: 1100px; }
  .lab { font-size: .62rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dom); border: 1px solid var(--dom-soft); background: var(--dom-soft); padding: 4px 8px; border-radius: 999px; }
  .estado { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .estado .chip { font-size: .72rem; }
  .barra { display: grid; gap: 10px; margin-bottom: 14px; }
  .filtros { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .ordenar { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .ordenar[hidden] { display: none; }
  .ordenar::-webkit-scrollbar { display: none; }
  .ordenar .lbl { flex: none; font: 700 .72rem var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ordenar button { flex: none; font: 600 .82rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .ordenar button.active { background: var(--x5, #E3182D); border-color: var(--x5, #E3182D); color: #fff; }
  .filtros input, .filtros select, .cfg input, .cfg select { width: 100%; min-width: 0; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  .cfg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
  .cfg label { display: grid; gap: 5px; font-size: .66rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .cfg .formula { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }
  .cfg .formula b { color: var(--dom); }
  details.card > summary { cursor: pointer; font-weight: 700; font-size: .85rem; list-style: none; display: flex; justify-content: space-between; }
  details.card > summary::after { content: '▾'; color: var(--muted); }
  details[open].card > summary { margin-bottom: 12px; }
  .cuenta { font-size: .78rem; color: var(--muted); margin: 0 2px 10px; }

  /* Vista cliente */
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .auto { all: unset; cursor: pointer; display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .15s; }
  .auto:hover { border-color: var(--line-strong); }
  .auto:active { transform: scale(.99); }
  .auto:focus-visible { outline: 2px solid var(--x5); outline-offset: 2px; }
  .foto { aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-3); position: relative; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto .sin { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: .75rem; }
  .foto .n { position: absolute; right: 8px; bottom: 8px; font-size: .68rem; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; padding: 3px 7px; border-radius: 6px; }
  .info { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
  .info h3 { margin: 0; font-size: 1rem; font-weight: 700; }
  .info .ver { font-size: .78rem; color: var(--muted); line-height: 1.3; }
  .specs { display: flex; flex-wrap: wrap; gap: 5px; }
  .specs span { font-size: .7rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .precio { font-size: 1.35rem; font-weight: 800; letter-spacing: -.3px; margin-top: 4px; }
  .precio small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }

  /* Vista interna */
  .lista { display: grid; gap: 8px; }
  .fila { display: grid; grid-template-columns: 92px minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; cursor: pointer; }
  .fila:hover { border-color: var(--line-strong); }
  .fila .foto { border-radius: 9px; }
  .fila .t { font-weight: 700; font-size: .9rem; }
  .fila .s { font-size: .72rem; color: var(--muted); line-height: 1.35; }
  .fila .k { font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .fila .v { font-weight: 700; font-size: .92rem; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .fila .chip { white-space: nowrap; margin-top: 5px; font-size: .68rem; }
  .galeria img { background: var(--surface-3); }

  /* Novedades */
  .ev { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .ev:last-child { border-bottom: 0; }
  .ev .f { font-size: .72rem; color: var(--muted); }

  /* Ficha */
  dialog { width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line-strong); border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .galeria { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; }
  .galeria img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; scroll-snap-align: center; }
  .ficha { padding: 16px 18px 18px; display: grid; gap: 12px; }
  .ficha h2 { margin: 0; font-size: 1.3rem; }
  .tabla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: .85rem; }
  .tabla div span { display: block; font-size: .66rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cerrar { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .interno { background: var(--dom-soft); border: 1px dashed color-mix(in srgb, var(--dom) 45%, transparent); border-radius: 12px; padding: 10px 12px; font-size: .8rem; display: grid; gap: 4px; }
  .interno a { color: var(--x5); }
  .vacio { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* Compra */
  #f-compra { margin-bottom: 12px; }
  .buscador { display: grid; grid-template-columns: 1.2fr 1.4fr .7fr .7fr 1.2fr auto; gap: 8px; align-items: end; }
  .buscador label { display: grid; gap: 5px; font-size: .66rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .buscador input, .buscador select { width: 100%; min-width: 0; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  .buscador .btn { white-space: nowrap; }
  .resumen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  .resumen div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .resumen span { display: block; font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .resumen b { font-size: 1.05rem; }
  .fuentes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  a.fila { color: inherit; text-decoration: none; }
  .conectar { display: grid; gap: 10px; font-size: .85rem; }
  .conectar ol { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
  .conectar .row input { flex: 3; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  @media (max-width: 760px) {
    .buscador { grid-template-columns: 1fr 1fr; }
    .buscador .modelo, .buscador .prov { grid-column: span 2; }
    .buscador .btn { grid-column: 1 / -1; }
    .resumen { grid-template-columns: 1fr 1fr; }
    .filtros { grid-template-columns: 1fr 1fr; }
    .filtros .q { grid-column: 1 / -1; }
    .cfg { grid-template-columns: 1fr 1fr; }
    .fila { grid-template-columns: 76px minmax(0, 1fr) auto; }
    .fila .c-x5 { text-align: right; }
    .fila .c-guia, .fila .c-ag { display: none; }
  }

  /* ── Estilo "Admin Dashboard" X5 (tarjeta roja, anillo, líder resaltado, semana) ── */
  .rx-hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 18px 16px; margin: 0 0 12px; border-radius: 20px; overflow: hidden; isolation: isolate; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.22), transparent 45%), linear-gradient(140deg, #F0283D 0%, #E3182D 40%, #8E0C1A 100%);
    box-shadow: 0 14px 30px rgba(227,24,45,.28), inset 0 1px 0 rgba(255,255,255,.25); animation: rx-in .5s cubic-bezier(.2,.8,.2,1) both; }
  .rx-hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); transform: translateX(-100%); animation: rx-sheen 2.4s .5s ease-in-out; }
  .rx-eye { font-size: .68rem; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; opacity: .85; margin: 0 0 6px; }
  .rx-big { font-size: 1.7rem; font-weight: 800; line-height: 1.1; margin: 0; }
  .rx-lbl { font-size: .85rem; opacity: .9; margin: 3px 0 0; }
  .rx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .rx-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.2); color: #fff; font: 600 .74rem var(--font); cursor: pointer; }
  .rx-chip b { font-weight: 800; }
  .rx-mejor { flex-direction: column; align-items: flex-start; gap: 1px; border-radius: 14px; text-align: left; }
  .rx-mejor span { font-size: .6rem; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
  .rx-ring { position: relative; width: 112px; height: 112px; }
  .rx-ring svg { width: 100%; height: 100%; } .rx-ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .rx-ring .tr { stroke: rgba(255,255,255,.22); } .rx-ring .v { stroke: #fff; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px rgba(255,255,255,.55)); }
  .rx-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; } .rx-pct b { font-size: 1.6rem; font-weight: 800; } .rx-pct small { font-weight: 700; opacity: .85; margin-top: 6px; }
  .fila.lead { border-color: color-mix(in srgb, var(--x5) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--x5) 35%, transparent), 0 10px 26px color-mix(in srgb, var(--x5) 18%, transparent); position: relative; }
  .fila.lead .c-x5 .pos { color: var(--x5-text); }
  .tag-lead { display: inline-block; font-size: .58rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #fff; background: var(--x5); padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; box-shadow: 0 0 10px color-mix(in srgb, var(--x5) 60%, transparent); }
  .rx-sem { margin: 0 0 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,.04), transparent 70%), var(--surface); animation: rx-in .5s cubic-bezier(.2,.8,.2,1) both; }
  .rx-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .rx-d { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 12px; }
  .rx-d span { font-size: .62rem; color: var(--muted); font-weight: 700; text-transform: uppercase; } .rx-d b { font-size: 1rem; font-weight: 800; }
  .rx-d.sel { background: linear-gradient(160deg, #E3182D, #8E0C1A); box-shadow: 0 6px 16px rgba(227,24,45,.3); } .rx-d.sel span { color: #fff; }
  .rx-bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
  .rx-bars i { width: 5px; border-radius: 2px; min-height: 2px; }
  .rx-ley { display: flex; gap: 12px; justify-content: center; margin-top: 8px; font-size: .68rem; color: var(--muted); flex-wrap: wrap; }
  .rx-ley span { display: inline-flex; gap: 5px; align-items: center; } .rx-ley i { width: 8px; height: 8px; border-radius: 2px; }
  .b-nuevo { background: var(--ok); } .b-precio { background: var(--warn); } .b-baja { background: var(--bad); }
  .grilla .auto, .lista .fila { animation: rx-in .45s cubic-bezier(.2,.8,.2,1) both; }
  .grilla .auto:nth-child(2), .lista .fila:nth-child(2) { animation-delay: .04s; } .grilla .auto:nth-child(3), .lista .fila:nth-child(3) { animation-delay: .08s; } .grilla .auto:nth-child(n+4), .lista .fila:nth-child(n+4) { animation-delay: .12s; }
  @keyframes rx-in { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes rx-sheen { to { transform: translateX(100%); } }
  @media (max-width: 360px) { .rx-hero { grid-template-columns: 1fr; } .rx-ring { justify-self: center; } }
  @media (prefers-reduced-motion: reduce) { .rx-hero, .rx-hero::after, .rx-sem, .grilla .auto, .lista .fila { animation: none; } .rx-ring .v { transition: none; } }

  /* Reservas, tapado de fotos y stock propio (v2.14) */
  .tapa { position: absolute; z-index: 1; border-radius: 6px; background: rgba(22,22,24,.58); backdrop-filter: blur(14px) saturate(.5); -webkit-backdrop-filter: blur(14px) saturate(.5); pointer-events: none; }
  /* Patente → placa blanca con el logo de X5; cartel amarillo → cartel rojo X5; logos ajenos → desenfocado */
  .tapa.pat { background: #fff url("../brand/x5-logo-rojo.png") center / auto 82% no-repeat; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.08); }
  .tapa.cartel { background: #E3182D url("../brand/x5-logo-blanco.png") center / auto 72% no-repeat; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .gimg { position: relative; flex: 0 0 100%; overflow: hidden; scroll-snap-align: center; }
  .gimg img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .auto { position: relative; }
  .auto.res .foto img, .auto.res .info { opacity: .45; }
  .cinta { position: absolute; z-index: 2; left: 10px; top: 10px; font: 800 .64rem var(--font); letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(17,17,19,.85); color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .cinta.mia { background: var(--dom); color: var(--on-dom, #06130f); border-color: transparent; }
  .cinta.vend { background: var(--x5, #E3182D); border-color: transparent; }
  .tag-propio { display: inline-block; font-size: .58rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--on-dom, #06130f); background: var(--dom); padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .tag-res { display: inline-block; font-size: .58rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #fff; background: #3a3a40; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .tag-res.mia { background: var(--dom); color: var(--on-dom, #06130f); } .tag-res.vend { background: var(--x5, #E3182D); }
  .sesion { font-size: .74rem; color: var(--muted); margin: -6px 2px 12px; }
  .sesion a { color: var(--dom); font-weight: 700; }
  .reserva { border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface-2); font-size: .86rem; }
  .reserva.mia { border-color: var(--dom); }
  .reserva form { display: grid; gap: 8px; }
  .reserva input, .rsv-cfg input { width: 100%; min-width: 0; font: 500 .88rem var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  .reserva small { color: var(--muted); font-size: .74rem; }
  .reserva .botones { display: flex; flex-wrap: wrap; gap: 8px; }
  .reserva .botones .btn { width: auto; flex: 1 1 auto; }
  .rsv-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .rsv-panel h3 { margin: 0 0 8px; font-size: .9rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rsv-it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: .82rem; }
  .rsv-it .s { color: var(--muted); font-size: .74rem; }
  .rsv-it .acc { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .rsv-it { grid-template-columns: 1fr; } .rsv-it .acc { justify-content: flex-start; } }
  .rsv-cfg { display: grid; gap: 10px; padding: 16px 18px 18px; }
  .rsv-cfg label { display: grid; gap: 4px; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .ed { padding: 14px 16px 16px; display: grid; gap: 10px; }
  .ed-stage { position: relative; user-select: none; touch-action: none; background: #000; border-radius: 12px; overflow: hidden; cursor: crosshair; }
  .ed-stage img { width: 100%; display: block; pointer-events: none; }
  .ed-box { position: absolute; border: 2px solid var(--dom); background: rgba(0,0,0,.45); border-radius: 4px; }
  .ed-box.prov { border-color: #f5c518; border-style: dashed; }
  .ed-box.auto { border-color: #38bdf8; border-style: dashed; background: rgba(56,189,248,.18); }
  .ed-box.t-pat:not(.auto) { background: rgba(255,255,255,.55); } .ed-box.t-cartel:not(.auto) { background: rgba(227,24,45,.55); }
  .ed-box span { position: absolute; left: 0; bottom: 100%; font: 700 .6rem var(--font); color: #fff; background: rgba(0,0,0,.7); padding: 1px 5px; border-radius: 4px 4px 0 0; white-space: nowrap; pointer-events: none; }
  .ed-box button { position: absolute; right: -10px; top: -10px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #E3182D; color: #fff; font: 700 .7rem var(--font); cursor: pointer; padding: 0; }
  .ed-seg { display: flex; gap: 6px; flex-wrap: wrap; } .ed-seg button { min-width: 0; } .ed-seg button { flex: 1; font: 700 .76rem var(--font); padding: 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); cursor: pointer; } .ed-seg button.active { background: var(--dom); color: var(--on-dom, #06130f); border-color: transparent; }
  .ed-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: .8rem; color: var(--muted); }
  .demo-banner { background: #f5c518; color: #161618; font: 700 .78rem var(--font); text-align: center; padding: 8px 12px; }
  .demo-banner select { font: inherit; margin-left: 6px; width: auto !important; display: inline-block; padding: 3px 8px !important; min-height: 0 !important; border-radius: 8px; }
</style>
</head>
<body>
<header class="x5-top">
  <a class="x5-back" href="../index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <img class="logo logo-mini" src="../brand/x5-logo-blanco.png" alt="X5 Argentina">
  <div><h1>Radar de Usados</h1><div class="sub">Stock de agencias con precio X5</div></div>
</header>

<main class="x5-wrap">
  <div class="estado" id="estado"></div>
  <div class="sesion" id="sesion" hidden></div>

  <div class="barra">
    <div class="seg" role="tablist">
      <button class="active" data-v="cliente">Cliente</button>
      <button data-v="interno">Interno</button>
      <button data-v="compra">Compra</button>
      <button data-v="guia">Guía CCA</button>
      <button data-v="novedades">Novedades</button>
    </div>

    <details class="card" id="cfg-box">
      <summary>Precio X5</summary>
      <div class="cfg">
        <label>Regla<select id="regla"><option value="mayor">El mayor: guía + % o agencia + %</option><option value="guia">Guía CCA + %</option><option value="fijo">Precio agencia + monto fijo</option></select></label>
        <label id="l-fijo"><span id="t-fijo">Monto fijo $</span><input id="fijo" type="number" inputmode="numeric" step="500000" value="6000000"></label>
        <label id="l-corte">Corte agencia $<input id="corte" type="number" inputmode="numeric" step="1000000" value="30000000"></label>
        <label id="l-pbajo">Agencia bajo el corte %<input id="pbajo" type="number" inputmode="decimal" step="1" value="20"></label>
        <label id="l-palto">Agencia desde el corte %<input id="palto" type="number" inputmode="decimal" step="1" value="10"></label>
        <label id="l-pct">Margen sobre guía %<input id="pct" type="number" inputmode="decimal" step="1" value="20"></label>
        <label>Papeles % (aparte)<input id="papeles" type="number" inputmode="decimal" step="1" value="10"></label>
        <label>Dólar $<input id="usd" type="number" inputmode="numeric" step="10" value="1540"></label>
        <div class="formula" id="formula"></div>
      </div>
    </details>

    <div class="filtros" id="filtros">
      <input class="q" id="q" type="search" placeholder="Buscar: Amarok, Hilux 2021, diésel…" aria-label="Buscar">
      <select id="marca" aria-label="Marca"><option value="">Todas las marcas</option></select>
      <select id="caja" aria-label="Caja"><option value="">Manual y automática</option><option value="man">Manual</option><option value="aut">Automática</option></select>
      <select id="orden" aria-label="Ordenar" hidden>
        <option value="nuevo">Recién publicados</option>
        <option value="barato">Precio: menor a mayor</option>
        <option value="caro">Precio: mayor a menor</option>
        <option value="anio">Año: más nuevo</option>
        <option value="km">Menos km</option>
        <option value="guia">Mejor frente a guía</option>
      </select>
    </div>
    <div class="ordenar" id="ordenar" role="group" aria-label="Ordenar por">
      <span class="lbl">Ordenar</span>
      <button type="button" data-o="barato">Más barato</button>
      <button type="button" data-o="caro">Más caro</button>
      <button type="button" data-o="anio">Año más nuevo</button>
      <button type="button" data-o="km">Menos km</button>
      <button type="button" data-o="nuevo">Recién publicados</button>
      <button type="button" data-o="guia" data-int="1">Mejor frente a guía</button>
    </div>
  </div>

  <div id="r-hero"></div>
  <div class="cuenta" id="cuenta"></div>
  <section id="v-cliente" class="grilla"></section>
  <section id="v-interno" class="lista" hidden></section>
  <section id="v-compra" hidden>
    <form class="card buscador" id="f-compra" autocomplete="off">
      <label>Marca<select id="c-marca" required><option value="">Elegí…</option></select></label>
      <label class="modelo">Modelo<input id="c-modelo" list="c-modelos" placeholder="Gol Trend, Hilux…" required></label>
      <label>Desde<input id="c-desde" type="number" inputmode="numeric" min="1990" max="2030" placeholder="Año"></label>
      <label>Hasta<input id="c-hasta" type="number" inputmode="numeric" min="1990" max="2030" placeholder="Año"></label>
      <label class="prov">Provincia<select id="c-prov"></select></label>
      <button class="btn btn-dom" type="submit" id="c-buscar">Buscar</button>
      <datalist id="c-modelos"></datalist>
    </form>
    <div id="c-res"></div>
  </section>
  <section id="v-guia" hidden>
    <form class="card buscador" id="f-guia" autocomplete="off" style="grid-template-columns:1.2fr 1.4fr .8fr 1.2fr">
      <label>Marca<select id="g-marca"><option value="">Elegí…</option></select></label>
      <label>Modelo<input id="g-modelo" list="g-modelos" placeholder="Gol Trend, Hilux…"></label>
      <label>Año<select id="g-anio"></select></label>
      <label>Versión (filtro)<input id="g-ver" placeholder="Ej.: 1.6, SRV, Automática"></label>
      <datalist id="g-modelos"></datalist>
    </form>
    <div id="g-res"></div>
  </section>
  <section id="v-novedades" class="card" hidden style="padding:0"></section>
</main>

<dialog id="ficha"></dialog>
<dialog id="editor"></dialog>
<dialog id="provs"></dialog>

<script>if (/[?&]demo=1/.test(location.search) && !window.RADAR_DEMO) document.write('<script src="demo.js"><\/script>');</script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = new Intl.NumberFormat('es-AR');
  const plata = (n) => n == null ? '—' : '$' + nf.format(Math.round(n));
  const mill = (n) => n == null ? '—' : '$' + (n / 1e6).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' M';
  const r100k = (n) => Math.round(n / 1e5) * 1e5;
  const fecha = (iso) => new Date(iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const guardar = (k, v) => { try { localStorage.setItem('radar.' + k, v); } catch (e) {} };
  const leer = (k) => { try { return localStorage.getItem('radar.' + k); } catch (e) { return null; } };

  let DATA = null, NOV = null, vista = leer('vista') || 'cliente';
  const AG = {};

  // ── Reservas compartidas, retoques de fotos y stock propio (v2.14) ──────────────
  // La sesión es la misma del Mini CRM (x5_session). Sin sesión, el Radar funciona igual pero no reserva.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwd9HUXBTCrmuZKglXS7cvPa56RHW3LcQQuXz-OgaMzYVQvcTnUZDA-QOukvf0bWqTu/exec';
  const DEMO = !!window.RADAR_DEMO || /[?&]demo=1/.test(location.search);
  const sesion = (() => { try { return JSON.parse(localStorage.getItem('x5_session')); } catch (e) { return null; } })();
  const SV = { ok: false, yo: null, supervisa: false, gerente: false, horas: 48, res: {}, ret: {}, provs: {}, propio: [], error: null, fp: '' };
  const AUTOC = {}; // cajas detectadas solas en la lectura del stock (stock.json → cubrir)
  async function post(b) {
    if (DEMO) return window.radarDemoPost(b);
    const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: sesion && sesion.token }, b)) });
    return r.json();
  }
  const puedeReservar = () => SV.ok && SV.yo && !['Supervisor', 'Control', 'Personal'].includes(SV.yo.rol);
  const resDe = (id) => SV.res[id];
  const venceTxt = (iso) => new Date(iso).toLocaleString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const ERRORES = { ya_reservado: 'Otro negociador la reservó recién', ya_vendido: 'La unidad ya se vendió', falta_cliente: 'Poné el nombre del cliente', sin_permiso: 'Tu usuario no puede hacer eso', ya_extendida: 'Ya la extendiste una vez: pedile a tu jefe', no_activa: 'La reserva ya no está activa', sesion_vencida: 'Tu sesión venció: volvé a ingresar al Hub' };
  function pintarSesion() {
    const el = $('#sesion'); if (!el) return;
    let h = '';
    if (DEMO) h = '';
    else if (!(sesion && sesion.token)) h = '🔒 Para reservar unidades, <a href="../crm.html">ingresá al Hub</a> con tu usuario.';
    else if (SV.error === 'accion_invalida' || SV.error === 'tabla_invalida') h = '⚠️ Las reservas necesitan el Code.gs v2.14 del Hub (Apps Script → Nueva versión).';
    else if (SV.error === 'sesion_vencida') h = '🔒 Tu sesión venció. <a href="../crm.html">Volvé a ingresar al Hub</a> para reservar.';
    else if (SV.error) h = '⚠️ No se pudieron leer las reservas (sin conexión). Reintentando…';
    else if (SV.ok) { const n = Object.values(SV.res).filter(r => r.estado === 'Activa').length; h = `🔒 Reservas conectadas · ${esc(SV.yo.nombre)} · ${n} ${n === 1 ? 'reserva activa' : 'reservas activas'} · duran ${SV.horas} h`; }
    el.innerHTML = h; el.hidden = !h || vista === 'cliente';
  }
  function mezclarPropio() {
    if (!DATA) return;
    DATA.autos = SV.propio.concat(DATA.autos.filter(a => !a.propio));
    AG.propio = { id: 'propio', nombre: 'Stock propio X5', ciudad: 'Mendoza', estado: 'ok' };
  }
  let sincronizando = false;
  async function sincronizar() {
    if (sincronizando || (!DEMO && !(sesion && sesion.token))) { pintarSesion(); return; }
    sincronizando = true;
    try {
      const r = await post({ action: 'radar_datos' });
      if (!r.ok) { SV.error = r.error || 'error'; SV.ok = false; return; }
      Object.assign(SV, { ok: true, error: null, yo: r.usuario, supervisa: !!r.supervisa, gerente: !!r.gerente, horas: r.horas || 48, ret: r.retoques || {} });
      SV.res = {}; (r.reservas || []).forEach(x => SV.res[x.auto_id] = x);
      SV.provs = {}; (r.proveedores || []).forEach(p => SV.provs[p.id] = p);
      const fp = JSON.stringify(r.propio || []);
      if (fp !== SV.fp) { SV.fp = fp; SV.propio = (r.propio || []).map(a => Object.assign({}, a, { propio: true, agencia: 'propio' })); mezclarPropio(); }
      if (!$('#ficha').open && !$('#editor').open && !$('#provs').open) render(); else retaparTodo();
    } catch (e) { SV.error = 'sin_conexion'; }
    finally { sincronizando = false; pintarSesion(); }
  }
  window.radarDemoResync = () => { SV.fp = ''; sincronizar(); };
  setInterval(() => { if (document.visibilityState === 'visible') sincronizar(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });

  // Tapado de patentes, carteles y logos: cajas [x, y, ancho, alto] en proporción de la foto.
  // Se dibujan encima de la imagen (con desenfoque) respetando el recorte de object-fit: cover.
  const cajasDe = (url, ag) => [].concat(SV.ret[url] !== undefined ? SV.ret[url] : AUTOC[url] || [], ag ? SV.ret['prov:' + ag] || [] : []);
  window.radarTapar = function (im) {
    const box = im.parentElement; if (!box) return;
    box.querySelectorAll(':scope > .tapa').forEach(x => x.remove());
    const cajas = cajasDe(im.dataset.src, im.dataset.ag);
    const nw = im.naturalWidth, nh = im.naturalHeight, cw = im.clientWidth, ch = im.clientHeight;
    if (!cajas.length || !nw || !cw) return;
    const k = Math.max(cw / nw, ch / nh), ox = (cw - nw * k) / 2 + im.offsetLeft, oy = (ch - nh * k) / 2 + im.offsetTop;
    cajas.forEach(([x, y, w, h, t]) => { const d = document.createElement('i'); d.className = 'tapa' + (t === 'pat' || t === 'cartel' ? ' ' + t : '');
      Object.assign(d.style, { left: (ox + x * nw * k) + 'px', top: (oy + y * nh * k) + 'px', width: (w * nw * k) + 'px', height: (h * nh * k) + 'px' }); box.appendChild(d); });
  };
  function retaparTodo() { document.querySelectorAll('img[data-src]').forEach(i => { if (i.complete && i.naturalWidth) radarTapar(i); }); }
  let tRes; addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(retaparTodo, 150); });

  const LS = (id) => id === 'regla' ? 'regla2' : id; // regla2: la regla "El mayor" pasa a ser la predeterminada
  ['regla', 'fijo', 'pct', 'corte', 'pbajo', 'palto', 'papeles', 'usd'].forEach(id => { const v = leer(LS(id)); if (v != null) $('#' + id).value = v; });

  const P = () => ({
    regla: $('#regla').value, fijo: +$('#fijo').value || 0, pct: (+$('#pct').value || 0) / 100,
    papeles: (+$('#papeles').value || 0) / 100, usd: +$('#usd').value || 1,
    corte: +$('#corte').value || 0, pbajo: (+$('#pbajo').value || 0) / 100, palto: (+$('#palto').value || 0) / 100,
  });

  // Regla "El mayor": se toma el más alto entre guía + % y precio de agencia + % (20% bajo el corte, 10% desde el corte)
  const porAgencia = (costo, p) => costo == null ? null : r100k(costo * (1 + (costo < p.corte ? p.pbajo : p.palto)));
  function precioMayor(costo, ref, cero, p) {
    const g = ref != null ? r100k(cero ? ref : ref * (1 + p.pct)) : null;
    const ag = porAgencia(costo, p);
    if (g == null && ag == null) return { x5: null, base: null };
    if (ag == null || (g != null && g >= ag)) return { x5: g, base: 'guía' };
    return { x5: ag, base: 'agencia' };
  }

  function calcular(a, p) {
    if (a.propio) { // stock propio: el precio cargado es el precio X5
      const v = a.precio == null ? null : (a.moneda === 'USD' ? a.precio * p.usd : a.precio);
      return { costo: null, ref: null, x5: v, cero: false, base: 'propio', calle: v != null ? r100k(v * (1 + p.papeles)) : null, margen: null, vsGuia: null };
    }
    const costo = a.precio == null ? null : (a.moneda === 'USD' ? a.precio * p.usd : a.precio);
    const ref = a.guia ? (a.guia.mejor?.valor ?? a.guia.med) : null;
    let x5 = null, base = null;
    if (p.regla === 'fijo' && costo != null) x5 = r100k(costo + p.fijo);
    const cero = a.anio >= new Date().getFullYear(); // 0 km: valor de guía, sin margen ni papeles
    if (p.regla === 'guia') x5 = ref != null ? r100k(cero ? ref : ref * (1 + p.pct)) : costo != null ? r100k(costo + p.fijo) : null; // sin guía (autos anteriores a 2012): agencia + monto fijo
    if (p.regla === 'mayor') ({ x5, base } = precioMayor(costo, ref, cero, p));
    const sinPapeles = cero && ref != null && (p.regla === 'guia' || base === 'guía');
    return { costo, ref, x5, cero, base, calle: x5 != null ? (sinPapeles ? x5 : r100k(x5 * (1 + p.papeles))) : null,
      margen: x5 != null && costo != null ? x5 - costo : null, vsGuia: x5 != null && ref ? x5 / ref - 1 : null };
  }

  function filtrados() {
    const p = P(), q = $('#q').value.trim().toLowerCase(), m = $('#marca').value, c = $('#caja').value;
    let L = DATA.autos.map(a => ({ a, k: calcular(a, p) }))
      .filter(({ a }) => (!m || a.marca === m) && (!c || (c === 'aut') === /autom/i.test(a.caja))
        && (!q || `${a.marca} ${a.modelo} ${a.version} ${a.anio} ${a.combustible} ${a.color}`.toLowerCase().includes(q)));
    const o = $('#orden').value;
    const key = { nuevo: x => -Date.parse(x.a.alta || x.a.publicado), barato: x => x.k.x5 ?? 1e15, caro: x => -(x.k.x5 ?? -1), anio: x => -x.a.anio * 1e7 + (x.a.km || 0), km: x => x.a.km ?? 1e9, guia: x => x.k.vsGuia ?? 1e9 }[o];
    return L.sort((x, y) => key(x) - key(y)).sort((x, y) => (y.a.propio ? 1 : 0) - (x.a.propio ? 1 : 0)); // el stock propio siempre arriba
  }

  const img = (src, alt, ag) => src ? `<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(src)}" data-src="${esc(src)}" data-ag="${esc(ag || '')}" onload="radarTapar(this)" alt="${esc(alt)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sin',textContent:'Foto no disponible'}))">` : '<span class="sin">Sin foto</span>';

  function render() {
    const p = P();
    $('#t-fijo').textContent = p.regla === 'fijo' ? 'Monto fijo $' : 'Autos sin guía: agencia + $';
    $('#l-pct').hidden = p.regla === 'fijo';
    $('#l-fijo').hidden = p.regla === 'mayor';
    ['l-corte', 'l-pbajo', 'l-palto'].forEach(id => $('#' + id).hidden = p.regla !== 'mayor');
    const pc = Math.round((1 + p.pct) * (1 + p.papeles) * 1000 - 1000) / 10;
    $('#formula').innerHTML = p.regla === 'mayor'
      ? `Precio X5 = <b>el mayor</b> entre guía + <b>${Math.round(p.pct * 100)}%</b> y precio de la agencia + <b>${Math.round(p.pbajo * 100)}%</b> (si vale menos de ${mill(p.corte)}) o + <b>${Math.round(p.palto * 100)}%</b> (desde ${mill(p.corte)}). Papeles aparte: + ${Math.round(p.papeles * 100)}%. Los 0 km con guía van al valor de guía. Cada unidad indica qué base ganó.`
      : p.regla === 'fijo'
      ? `Precio X5 = precio de la agencia + <b>${plata(p.fijo)}</b>. Puesto en calle = precio X5 + ${Math.round(p.papeles * 100)}% de papeles.`
      : `Precio X5 = guía + <b>${Math.round(p.pct * 100)}%</b>. Con ${Math.round(p.papeles * 100)}% de papeles, puesto en calle queda en guía + <b>${pc.toLocaleString('es-AR')}%</b>. Los 0 km van al valor de guía, sin recargo. Los autos que no figuran en la guía (anteriores a 2012) usan precio de agencia + ${plata(p.fijo)}.`;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.v === vista));
    ['cliente', 'interno', 'compra', 'guia', 'novedades'].forEach(v => $('#v-' + v).hidden = v !== vista);
    $('#filtros').hidden = ['compra', 'guia', 'novedades'].includes(vista);
    $('#ordenar').hidden = ['compra', 'guia', 'novedades'].includes(vista);
    $('#ordenar [data-int]').hidden = vista === 'cliente';
    if (vista === 'cliente' && $('#orden').value === 'guia') $('#orden').value = 'nuevo';
    document.querySelectorAll('#ordenar button').forEach(b => b.classList.toggle('active', b.dataset.o === $('#orden').value));
    $('#cfg-box').hidden = vista === 'cliente';
    $('#estado').hidden = vista === 'cliente';
    if ($('#sesion')) $('#sesion').hidden = vista === 'cliente' || !$('#sesion').innerHTML;
    $('#r-hero').innerHTML = '';
    if (vista === 'compra') return prepararCompra();
    if (vista === 'guia') return prepararGuia();
    if (!DATA) return;
    if (vista === 'novedades') return renderNovedades();
    const L = filtrados().filter(x => (vista === 'interno' || x.k.x5 != null) && !(vista === 'cliente' && resDe(x.a.id)?.estado === 'Vendida')); // lo vendido no se muestra al cliente
    $('#cuenta').textContent = `${L.length} ${L.length === 1 ? 'unidad' : 'unidades'}${vista === 'cliente' ? ' disponibles' : ''}`;
    const lider = vista === 'interno' ? heroInterno(L) : null;
    if (vista === 'interno' && (SV.ok || DEMO)) $('#r-hero').insertAdjacentHTML('afterbegin', panelReservas());
    pintarSesion();
    if (!L.length) { $('#v-' + vista).innerHTML = '<div class="vacio">Ninguna unidad coincide con la búsqueda.</div>'; return; }
    if (vista === 'cliente') {
      $('#v-cliente').innerHTML = L.map(({ a, k }) => `
        <button class="auto${resDe(a.id) && !resDe(a.id).mia ? ' res' : ''}" data-id="${esc(a.id)}">
          <div class="foto">${cinta(a)}${img(a.fotos[0], `${a.marca} ${a.modelo}`, a.agencia)}${a.fotos.length > 1 ? `<span class="n">${a.fotos.length} fotos</span>` : ''}</div>
          <div class="info">
            <h3>${esc(a.marca)} ${esc(a.modelo)}</h3>
            <div class="ver">${esc(a.version)}</div>
            <div class="specs"><span>${a.anio}</span><span>${a.km != null ? nf.format(a.km) + ' km' : 's/d km'}</span><span>${esc(a.caja)}</span>${a.combustible ? `<span>${esc(a.combustible)}</span>` : ''}</div>
            <div class="precio num">${plata(k.x5)}<small>${k.calle === k.x5 ? 'Precio final' : '+ papeles · puesto en calle ' + plata(k.calle)}</small></div>
          </div>
        </button>`).join('');
    } else {
      $('#v-interno').innerHTML = L.map(({ a, k }) => {
        const ag = AG[a.agencia]?.nombre || a.agencia;
        const vs = k.vsGuia;
        const esL = lider && a.id === lider;
        return `<div class="fila${esL ? ' lead' : ''}" data-id="${esc(a.id)}" tabindex="0">
          <div class="foto">${img(a.fotos[0], a.modelo, a.agencia)}</div>
          <div><div class="t">${esc(a.marca)} ${esc(a.modelo)} ${a.anio}${a.propio ? '<span class="tag-propio">Propio</span>' : ''}${esL ? '<span class="tag-lead">Mejor margen</span>' : ''}${tagRes(a)}</div><div class="s">${esc(a.version)} · ${a.km != null ? nf.format(a.km) + ' km' : ''} · ${esc(a.caja)}<br>${esc(ag)}${a.sucursal ? ' · ' + esc(a.sucursal) : ''} · publicado ${fecha(a.alta || a.publicado).split(',')[0]}${a.oportunidad ? ' · <b style="color:var(--dom)">Oportunidad</b>' : ''}</div></div>
          <div class="c-ag"><div class="k">${a.propio ? 'Precio cargado' : 'Agencia'}</div><div class="v num">${a.precio == null ? 'A confirmar' : a.moneda === 'USD' ? 'U$S ' + nf.format(a.precio) : mill(a.precio)}</div></div>
          <div class="c-guia"><div class="k">Guía${a.guia?.mejor ? '' : ' (mediana)'}</div><div class="v num">${mill(k.ref)}</div></div>
          <div class="c-x5"><div class="k">Precio X5${k.base ? ` <span class="chip ${k.base === 'agencia' ? 'warn' : 'x5'}" title="Base que ganó en la regla El mayor">por ${k.base}</span>` : ''}</div><div class="v num">${mill(k.x5)}</div><div class="s num">${k.margen != null ? `<span class="${k.margen >= 0 ? 'pos' : 'neg'}">${k.margen >= 0 ? '+' : '−'}${mill(Math.abs(k.margen))}</span>` : ''}</div>
            ${a.precio == null && P().regla === 'fijo' ? '<span class="chip">sin precio</span>' : vs == null ? '<span class="chip">sin guía</span>' : `<span class="chip ${vs <= 0 ? 'ok' : vs <= .15 ? 'x5' : vs <= .3 ? 'warn' : 'bad'}">guía ${vs >= 0 ? '+' : '−'}${Math.abs(Math.round(vs * 100))}%</span>`}</div>
        </div>`;
      }).join('');
    }
  }

  async function renderNovedades() {
    $('#cuenta').textContent = 'Últimos 90 días';
    if (!NOV) {
      try { NOV = await (await fetch('data/novedades.json', { cache: 'no-store' })).json(); } catch (e) { NOV = { eventos: [] }; }
    }
    const ev = NOV.eventos;

  // ── Tarjeta del Interno: anillo de unidades bajo guía y mejor margen (ref. "Admin Dashboard V5") ──
  let pctAnt = null, diaNov = '';
  const RMOV = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function heroInterno(L) {
    // Se descartan los 0 km y los precios que no llegan a la mitad de la guía (suelen ser anticipos o errores de carga)

      <div class="rx-ring" role="img" aria-label="${pct}% bajo guía"><svg viewBox="-60 -60 120 120"><circle r="${R}" class="tr"/><circle r="${R}" class="v" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - (pctAnt ?? 0) / 100)).toFixed(1)}" data-off="${(C * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90)"/></svg><span class="rx-pct"><b data-p="${pct}">${pctAnt ?? 0}</b><small>%</small></span></div></section>`;

      const t0 = performance.now(), paso = t => { const q = Math.min(1, (t - t0) / 1000), e = 1 - Math.pow(1 - q, 3); b.textContent = Math.round(ini + (pct - ini) * e); if (q < 1) requestAnimationFrame(paso); };

  // ── Novedades: últimos 7 días con barras por tipo (nuevos, precio, salieron) ──

  function semanaNov(ev) {
    const DC = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], dias = [];

    const max = Math.max(1, ...dias.flatMap(f => Object.values(cnt[f] || {})));

    return `<section class="rx-sem" aria-label="Novedades de los últimos 7 días"><div class="rx-dias">${dias.map((f, i) => { const c = cnt[f] || { nuevo: 0, precio: 0, baja: 0 }, d = new Date(f + 'T12:00:00');
      return `<button class="rx-d${f === diaNov ? ' sel' : ''}" data-f="${f}" aria-label="${d.getDate()}/${d.getMonth() + 1}: ${c.nuevo} nuevos, ${c.precio} cambios de precio, ${c.baja} salieron"><span>${i === 6 ? 'Hoy' : DC[d.getDay()]}</span><b>${d.getDate()}</b><span class="rx-bars">${['nuevo', 'precio', 'baja'].map(t => `<i class="b-${t}" style="height:${c[t] ? Math.max(3, c[t] / max * 22) : 2}px;opacity:${c[t] ? 1 : .25}"></i>`).join('')}</span></button>`; }).join('')}</div>

  const BUSCADOR_URL = 'https://script.google.com/macros/s/AKfycbw6ohUpR016N1P1rHk0W3E6PR0FlIoWZdrm2S7Fjf6MWqkwfT5xNb72MT_MobD9yrLLpg/exec'; // URL /exec del Apps Script Buscador.gs (si queda vacío, se pide en pantalla)

  function consultarGuia() {
    const marca = $('#g-marca').value, anio = $('#g-anio').value, mod = sinTilde($('#g-modelo').value).trim(), ver = sinTilde($('#g-ver').value).trim();
    const out = $('#g-res');

    const modelos = GUIA.marcas[marca] || {};
    const filas = [];
    Object.entries(modelos).forEach(([m, vers]) => {
      if (mod && !sinTilde(m).includes(mod)) return;
      vers.forEach(([v, p]) => { if (p[anio] && (!ver || sinTilde(m + ' ' + v).includes(ver))) filas.push([titulo(m), v, p[anio]]); });
    });
    if (!filas.length) { out.innerHTML = '<div class="vacio">No hay valores en la guía para esa combinación. Probá con otro año o sin el filtro de versión.</div>'; return; }
    filas.sort((a, b) => a[0].localeCompare(b[0]) || a[2] - b[2]);

    out.innerHTML = `<div class="card" style="padding:0"><div style="padding:10px 14px;font-size:.78rem;color:var(--muted)">${filas.length} ${filas.length === 1 ? 'versión' : 'versiones'} · ${anio === '0km' ? '0 km' : anio} · guía CCA ${esc(GUIA.mes)}${filas.length > tope.length ? ' · mostrando las primeras 80, afiná con modelo o versión' : ''}</div>` +

  function analizar(a, p) {

    (d.cubrir ? Object.entries(d.cubrir) : []).forEach(([u, c]) => AUTOC[u] = c); // cajas automáticas, si el lector las detecta
    if (SV.propio.length) mezclarPropio();
    $('#estado').innerHTML = d.agencias.map(a => `<span class="chip ${a.estado === 'ok' ? 'ok' : 'bad'}" title="${esc(a.detalle || '')}">${esc(a.nombre)} · ${a.autos} autos · ${a.estado === 'ok' ? 'leído ' + fecha(a.actualizado) : 'falló la lectura, se muestra el stock anterior'}</span>`).join('');
    const marcas = [...new Set(d.autos.map(a => a.marca).filter(Boolean))].sort();
    $('#marca').insertAdjacentHTML('beforeend', marcas.map(m => `<option>${esc(m)}</option>`).join(''));
    render();
    sincronizar();
  }).catch(() => { $('#v-cliente').innerHTML = '<div class="vacio">No se pudo cargar el stock. Revisá la conexión y volvé a abrir la página.</div>'; });
})();
</script>
</body>
</html>
