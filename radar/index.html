<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>X5 Cuyo · Radar de Usados</title>
<meta name="theme-color" content="#161618">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../x5-theme.css">
<style>
  /* Radar de Usados — herramienta del Hub (los datos de /data nunca se guardan en la caché de la app). */
  .x5-wrap { max-width: 1100px; }
  .lab { font-size: .62rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dom); border: 1px solid var(--dom-soft); background: var(--dom-soft); padding: 4px 8px; border-radius: 999px; }
  .estado { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .estado .chip { font-size: .72rem; }
  .barra { display: grid; gap: 10px; margin-bottom: 14px; }
  .filtros { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .ordenar { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .ordenar[hidden] { display: none; }
  .ordenar::-webkit-scrollbar { display: none; }
  .ordenar .lbl { flex: none; font: 700 .72rem var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ordenar button { flex: none; font: 600 .82rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .ordenar button.active { background: var(--x5, #E3182D); border-color: var(--x5, #E3182D); color: #fff; }
  .filtros input, .filtros select, .cfg input, .cfg select { width: 100%; min-width: 0; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  .cfg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; }
  .cfg label { display: grid; gap: 5px; font-size: .66rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .cfg .formula { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); }
  .cfg .formula b { color: var(--dom); }
  details.card > summary { cursor: pointer; font-weight: 700; font-size: .85rem; list-style: none; display: flex; justify-content: space-between; }
  details.card > summary::after { content: '▾'; color: var(--muted); }
  details[open].card > summary { margin-bottom: 12px; }
  .cuenta { font-size: .78rem; color: var(--muted); margin: 0 2px 10px; }

  /* Vista cliente */
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .auto { all: unset; cursor: pointer; display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .15s; }
  .auto:hover { border-color: var(--line-strong); }
  .auto:active { transform: scale(.99); }
  .auto:focus-visible { outline: 2px solid var(--x5); outline-offset: 2px; }
  .foto { aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-3); position: relative; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto .sin { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: .75rem; }
  .foto .n { position: absolute; right: 8px; bottom: 8px; font-size: .68rem; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; padding: 3px 7px; border-radius: 6px; }
  .info { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
  .info h3 { margin: 0; font-size: 1rem; font-weight: 700; }
  .info .ver { font-size: .78rem; color: var(--muted); line-height: 1.3; }
  .specs { display: flex; flex-wrap: wrap; gap: 5px; }
  .specs span { font-size: .7rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .precio { font-size: 1.35rem; font-weight: 800; letter-spacing: -.3px; margin-top: 4px; }
  .precio small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }

  /* Vista interna */
  .lista { display: grid; gap: 8px; }
  .fila { display: grid; grid-template-columns: 92px minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; cursor: pointer; }
  .fila:hover { border-color: var(--line-strong); }
  .fila .foto { border-radius: 9px; }
  .fila .t { font-weight: 700; font-size: .9rem; }
  .fila .s { font-size: .72rem; color: var(--muted); line-height: 1.35; }
  .fila .k { font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .fila .v { font-weight: 700; font-size: .92rem; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .fila .chip { white-space: nowrap; margin-top: 5px; font-size: .68rem; }
  .galeria img { background: var(--surface-3); }

  /* Novedades */
  .ev { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .ev:last-child { border-bottom: 0; }
  .ev .f { font-size: .72rem; color: var(--muted); }

  /* Ficha */
  dialog { width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line-strong); border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  .galeria { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; }
  .galeria img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; scroll-snap-align: center; }
  .ficha { padding: 16px 18px 18px; display: grid; gap: 12px; }
  .ficha h2 { margin: 0; font-size: 1.3rem; }
  .tabla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: .85rem; }
  .tabla div span { display: block; font-size: .66rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cerrar { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .interno { background: var(--dom-soft); border: 1px dashed color-mix(in srgb, var(--dom) 45%, transparent); border-radius: 12px; padding: 10px 12px; font-size: .8rem; display: grid; gap: 4px; }
  .interno a { color: var(--x5); }
  .vacio { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* Compra */
  #f-compra { margin-bottom: 12px; }
  .buscador { display: grid; grid-template-columns: 1.2fr 1.4fr .7fr .7fr 1.2fr auto; gap: 8px; align-items: end; }
  .buscador label { display: grid; gap: 5px; font-size: .66rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .buscador input, .buscador select { width: 100%; min-width: 0; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  .buscador .btn { white-space: nowrap; }
  .resumen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  .resumen div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .resumen span { display: block; font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .resumen b { font-size: 1.05rem; }
  .fuentes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  a.fila { color: inherit; text-decoration: none; }
  .conectar { display: grid; gap: 10px; font-size: .85rem; }
  .conectar ol { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
  .conectar .row input { flex: 3; font: 500 .85rem var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; }
  @media (max-width: 760px) {
    .buscador { grid-template-columns: 1fr 1fr; }
    .buscador .modelo, .buscador .prov { grid-column: span 2; }
    .buscador .btn { grid-column: 1 / -1; }
    .resumen { grid-template-columns: 1fr 1fr; }
    .filtros { grid-template-columns: 1fr 1fr; }
    .filtros .q { grid-column: 1 / -1; }
    .cfg { grid-template-columns: 1fr 1fr; }
    .fila { grid-template-columns: 76px minmax(0, 1fr) auto; }
    .fila .c-x5 { text-align: right; }
    .fila .c-guia, .fila .c-ag { display: none; }
  }

  /* ── Estilo "Admin Dashboard" X5 (tarjeta roja, anillo, líder resaltado, semana) ── */
  .rx-hero { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 18px 16px; margin: 0 0 12px; border-radius: 20px; overflow: hidden; isolation: isolate; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.22), transparent 45%), linear-gradient(140deg, #F0283D 0%, #E3182D 40%, #8E0C1A 100%);
    box-shadow: 0 14px 30px rgba(227,24,45,.28), inset 0 1px 0 rgba(255,255,255,.25); animation: rx-in .5s cubic-bezier(.2,.8,.2,1) both; }
  .rx-hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); transform: translateX(-100%); animation: rx-sheen 2.4s .5s ease-in-out; }
  .rx-eye { font-size: .68rem; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; opacity: .85; margin: 0 0 6px; }
  .rx-big { font-size: 1.7rem; font-weight: 800; line-height: 1.1; margin: 0; }
  .rx-lbl { font-size: .85rem; opacity: .9; margin: 3px 0 0; }
  .rx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .rx-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.2); color: #fff; font: 600 .74rem var(--font); cursor: pointer; }
  .rx-chip b { font-weight: 800; }
  .rx-mejor { flex-direction: column; align-items: flex-start; gap: 1px; border-radius: 14px; text-align: left; }
  .rx-mejor span { font-size: .6rem; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
  .rx-ring { position: relative; width: 112px; height: 112px; }
  .rx-ring svg { width: 100%; height: 100%; } .rx-ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .rx-ring .tr { stroke: rgba(255,255,255,.22); } .rx-ring .v { stroke: #fff; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px rgba(255,255,255,.55)); }
  .rx-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; } .rx-pct b { font-size: 1.6rem; font-weight: 800; } .rx-pct small { font-weight: 700; opacity: .85; margin-top: 6px; }
  .fila.lead { border-color: color-mix(in srgb, var(--x5) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--x5) 35%, transparent), 0 10px 26px color-mix(in srgb, var(--x5) 18%, transparent); position: relative; }
  .fila.lead .c-x5 .pos { color: var(--x5-text); }
  .tag-lead { display: inline-block; font-size: .58rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #fff; background: var(--x5); padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; box-shadow: 0 0 10px color-mix(in srgb, var(--x5) 60%, transparent); }
  .rx-sem { margin: 0 0 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,.04), transparent 70%), var(--surface); animation: rx-in .5s cubic-bezier(.2,.8,.2,1) both; }
  .rx-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .rx-d { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 12px; }
  .rx-d span { font-size: .62rem; color: var(--muted); font-weight: 700; text-transform: uppercase; } .rx-d b { font-size: 1rem; font-weight: 800; }
  .rx-d.sel { background: linear-gradient(160deg, #E3182D, #8E0C1A); box-shadow: 0 6px 16px rgba(227,24,45,.3); } .rx-d.sel span { color: #fff; }
  .rx-bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
  .rx-bars i { width: 5px; border-radius: 2px; min-height: 2px; }
  .rx-ley { display: flex; gap: 12px; justify-content: center; margin-top: 8px; font-size: .68rem; color: var(--muted); flex-wrap: wrap; }
  .rx-ley span { display: inline-flex; gap: 5px; align-items: center; } .rx-ley i { width: 8px; height: 8px; border-radius: 2px; }
  .b-nuevo { background: var(--ok); } .b-precio { background: var(--warn); } .b-baja { background: var(--bad); }
  .grilla .auto, .lista .fila { animation: rx-in .45s cubic-bezier(.2,.8,.2,1) both; }
  .grilla .auto:nth-child(2), .lista .fila:nth-child(2) { animation-delay: .04s; } .grilla .auto:nth-child(3), .lista .fila:nth-child(3) { animation-delay: .08s; } .grilla .auto:nth-child(n+4), .lista .fila:nth-child(n+4) { animation-delay: .12s; }
  @keyframes rx-in { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes rx-sheen { to { transform: translateX(100%); } }
  @media (max-width: 360px) { .rx-hero { grid-template-columns: 1fr; } .rx-ring { justify-self: center; } }
  @media (prefers-reduced-motion: reduce) { .rx-hero, .rx-hero::after, .rx-sem, .grilla .auto, .lista .fila { animation: none; } .rx-ring .v { transition: none; } }
</style>
</head>
<body>
<header class="x5-top">
  <a class="x5-back" href="../index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <img class="logo logo-mini" src="../brand/x5-logo-blanco.png" alt="X5 Argentina">
  <div><h1>Radar de Usados</h1><div class="sub">Stock de agencias con precio X5</div></div>
</header>

<main class="x5-wrap">
  <div class="estado" id="estado"></div>

  <div class="barra">
    <div class="seg" role="tablist">
      <button class="active" data-v="cliente">Cliente</button>
      <button data-v="interno">Interno</button>
      <button data-v="compra">Compra</button>
      <button data-v="novedades">Novedades</button>
    </div>

    <details class="card" id="cfg-box">
      <summary>Precio X5</summary>
      <div class="cfg">
        <label>Regla<select id="regla"><option value="mayor">El mayor: guía + % o agencia + %</option><option value="guia">Guía CCA + %</option><option value="fijo">Precio agencia + monto fijo</option></select></label>
        <label id="l-fijo"><span id="t-fijo">Monto fijo $</span><input id="fijo" type="number" inputmode="numeric" step="500000" value="6000000"></label>
        <label id="l-corte">Corte agencia $<input id="corte" type="number" inputmode="numeric" step="1000000" value="30000000"></label>
        <label id="l-pbajo">Agencia bajo el corte %<input id="pbajo" type="number" inputmode="decimal" step="1" value="20"></label>
        <label id="l-palto">Agencia desde el corte %<input id="palto" type="number" inputmode="decimal" step="1" value="10"></label>
        <label id="l-pct">Margen sobre guía %<input id="pct" type="number" inputmode="decimal" step="1" value="20"></label>
        <label>Papeles % (aparte)<input id="papeles" type="number" inputmode="decimal" step="1" value="10"></label>
        <label>Dólar $<input id="usd" type="number" inputmode="numeric" step="10" value="1540"></label>
        <div class="formula" id="formula"></div>
      </div>
    </details>

    <div class="filtros" id="filtros">
      <input class="q" id="q" type="search" placeholder="Buscar: Amarok, Hilux 2021, diésel…" aria-label="Buscar">
      <select id="marca" aria-label="Marca"><option value="">Todas las marcas</option></select>
      <select id="caja" aria-label="Caja"><option value="">Manual y automática</option><option value="man">Manual</option><option value="aut">Automática</option></select>
      <select id="orden" aria-label="Ordenar" hidden>
        <option value="nuevo">Recién publicados</option>
        <option value="barato">Precio: menor a mayor</option>
        <option value="caro">Precio: mayor a menor</option>
        <option value="anio">Año: más nuevo</option>
        <option value="km">Menos km</option>
        <option value="guia">Mejor frente a guía</option>
      </select>
    </div>
    <div class="ordenar" id="ordenar" role="group" aria-label="Ordenar por">
      <span class="lbl">Ordenar</span>
      <button type="button" data-o="barato">Más barato</button>
      <button type="button" data-o="caro">Más caro</button>
      <button type="button" data-o="anio">Año más nuevo</button>
      <button type="button" data-o="km">Menos km</button>
      <button type="button" data-o="nuevo">Recién publicados</button>
      <button type="button" data-o="guia" data-int="1">Mejor frente a guía</button>
    </div>
  </div>

  <div id="r-hero"></div>
  <div class="cuenta" id="cuenta"></div>
  <section id="v-cliente" class="grilla"></section>
  <section id="v-interno" class="lista" hidden></section>
  <section id="v-compra" hidden>
    <form class="card buscador" id="f-compra" autocomplete="off">
      <label>Marca<select id="c-marca" required><option value="">Elegí…</option></select></label>
      <label class="modelo">Modelo<input id="c-modelo" list="c-modelos" placeholder="Gol Trend, Hilux…" required></label>
      <label>Desde<input id="c-desde" type="number" inputmode="numeric" min="1990" max="2030" placeholder="Año"></label>
      <label>Hasta<input id="c-hasta" type="number" inputmode="numeric" min="1990" max="2030" placeholder="Año"></label>
      <label class="prov">Provincia<select id="c-prov"></select></label>
      <button class="btn btn-dom" type="submit" id="c-buscar">Buscar</button>
      <datalist id="c-modelos"></datalist>
    </form>
    <div id="c-res"></div>
  </section>
  <section id="v-novedades" class="card" hidden style="padding:0"></section>
</main>

<dialog id="ficha"></dialog>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = new Intl.NumberFormat('es-AR');
  const plata = (n) => n == null ? '—' : '$' + nf.format(Math.round(n));
  const mill = (n) => n == null ? '—' : '$' + (n / 1e6).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' M';
  const r100k = (n) => Math.round(n / 1e5) * 1e5;
  const fecha = (iso) => new Date(iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const guardar = (k, v) => { try { localStorage.setItem('radar.' + k, v); } catch (e) {} };
  const leer = (k) => { try { return localStorage.getItem('radar.' + k); } catch (e) { return null; } };

  let DATA = null, NOV = null, vista = leer('vista') || 'cliente';
  const AG = {};

  const LS = (id) => id === 'regla' ? 'regla2' : id; // regla2: la regla "El mayor" pasa a ser la predeterminada
  ['regla', 'fijo', 'pct', 'corte', 'pbajo', 'palto', 'papeles', 'usd'].forEach(id => { const v = leer(LS(id)); if (v != null) $('#' + id).value = v; });

  const P = () => ({
    regla: $('#regla').value, fijo: +$('#fijo').value || 0, pct: (+$('#pct').value || 0) / 100,
    papeles: (+$('#papeles').value || 0) / 100, usd: +$('#usd').value || 1,
    corte: +$('#corte').value || 0, pbajo: (+$('#pbajo').value || 0) / 100, palto: (+$('#palto').value || 0) / 100,
  });

  // Regla "El mayor": se toma el más alto entre guía + % y precio de agencia + % (20% bajo el corte, 10% desde el corte)
  const porAgencia = (costo, p) => costo == null ? null : r100k(costo * (1 + (costo < p.corte ? p.pbajo : p.palto)));
  function precioMayor(costo, ref, cero, p) {
    const g = ref != null ? r100k(cero ? ref : ref * (1 + p.pct)) : null;
    const ag = porAgencia(costo, p);
    if (g == null && ag == null) return { x5: null, base: null };
    if (ag == null || (g != null && g >= ag)) return { x5: g, base: 'guía' };
    return { x5: ag, base: 'agencia' };
  }

  function calcular(a, p) {
    const costo = a.precio == null ? null : (a.moneda === 'USD' ? a.precio * p.usd : a.precio);
    const ref = a.guia ? (a.guia.mejor?.valor ?? a.guia.med) : null;
    let x5 = null, base = null;
    if (p.regla === 'fijo' && costo != null) x5 = r100k(costo + p.fijo);
    const cero = a.anio >= new Date().getFullYear(); // 0 km: valor de guía, sin margen ni papeles

  let pctAnt = null, diaNov = '';

  function heroInterno(L) {

    const prom = conM.length ? conM.reduce((s, x) => s + x.k.margen, 0) / conM.length : null;

      <div class="rx-ring" role="img" aria-label="${pct}% bajo guía"><svg viewBox="-60 -60 120 120"><circle r="${R}" class="tr"/><circle r="${R}" class="v" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - (pctAnt ?? 0) / 100)).toFixed(1)}" data-off="${(C * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90)"/></svg><span class="rx-pct"><b data-p="${pct}">${pctAnt ?? 0}</b><small>%</small></span></div></section>`;
    const v = $('#r-hero .v'), b = $('#r-hero .rx-pct b'), ini = pctAnt ?? 0; pctAnt = pct;

  const diaLocal = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function semanaNov(ev) {
    const DC = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], dias = [];

  }

      $('#c-marca').insertAdjacentHTML('beforeend', marcas.map(m => `<option value="${esc(m)}">${esc(titulo(m))}</option>`).join(''));
      $('#c-marca').addEventListener('input', () => {
        const mods = [...new Set(Object.keys(GUIA.marcas[$('#c-marca').value] || {}).map(m => titulo(m.replace(/\s*PICK\s*-?\s*UP.*$/i, ''))))].sort();
        $('#c-modelos').innerHTML = mods.map(m => `<option value="${esc(m)}">`).join('');
      });
    }
    if (!urlBuscador()) return pedirConexion();
    if (ultimo) mostrarResultados(ultimo); else if (!$('#c-res').innerHTML) $('#c-res').innerHTML = '<div class="vacio">Elegí marca y modelo de lo que pide el cliente. Se busca en DeRuedas, Autocosmos y el stock de las agencias, y se compara cada precio con la guía.</div>';
  }

  function pedirConexion() {
    $('#c-res').innerHTML = `<div class="card conectar">
      <b>Falta conectar el buscador</b>
      <ol><li>Abrí script.google.com → Nuevo proyecto.</li><li>Pegá el archivo <code>radar/apps-script/Buscador.gs</code> del repositorio.</li>
      <li>Implementar → Nueva implementación → Aplicación web · Ejecutar como: Yo · Acceso: Cualquier persona.</li><li>Copiá la URL que termina en <code>/exec</code> y pegala acá.</li></ol>
      <div class="row"><input id="c-url" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn btn-dom btn-sm" id="c-guardar" type="button">Conectar</button></div></div>`;
    $('#c-guardar').onclick = () => { const u = $('#c-url').value.trim(); if (/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { guardar('buscador', u); prepararCompra(); } else $('#c-url').focus(); };
  }

  function analizar(a, p) {
    const ars = a.precio == null ? null : (a.moneda === 'USD' ? a.precio * p.usd : a.precio);
    const caja = a.caja || (AUTOMATICA.test(a.version) ? 'Automática' : 'Manual');
    const g = GUIA && a.anio ? cruzarGuia({ ...a, caja }, GUIA) : null;
    const ref = g ? (g.mejor?.valor ?? g.med) : null;
    const cero = a.anio >= new Date().getFullYear();
    const venta = p.regla === 'mayor' ? precioMayor(ars, ref, cero, p).x5 : ref ? r100k(cero ? ref : ref * (1 + p.pct)) : null;
    return { ars, ref, g, venta, margen: venta != null && ars != null ? venta - ars : null, ratio: ref && ars ? ars / ref : null };
  }

  const pill = (ratio) => ratio == null ? '<span class="chip">sin guía</span>'
    : ratio <= .9 ? '<span class="chip ok">Muy buena compra</span>' : ratio <= 1 ? '<span class="chip x5">Buena compra</span>'
    : ratio <= 1.1 ? '<span class="chip warn">Precio justo</span>' : '<span class="chip bad">Cara</span>';

  function stockLocal(q) {
    if (!DATA) return [];
    const mod = sinTilde(q.modelo);
    return DATA.autos.filter(a => sinTilde(a.marca) === sinTilde(q.marca) && sinTilde(a.modelo).startsWith(mod)
      && (!q.desde || a.anio >= q.desde) && (!q.hasta || a.anio <= q.hasta)
      && (!q.provincia || sinTilde(a.provincia || AG[a.agencia]?.ciudad) === sinTilde(q.provincia)))
      .map(a => ({ fuente: a.agencia, fuenteNombre: AG[a.agencia]?.nombre, vendedor: AG[a.agencia]?.nombre, marca: a.marca, modelo: a.modelo, version: a.version, anio: a.anio, km: a.km, caja: a.caja,
        precio: a.precio, moneda: a.moneda, provincia: a.provincia || AG[a.agencia]?.ciudad, localidad: a.sucursal || '', foto: a.fotos[0], url: a.url, id: a.id }));
  }

  async function buscarCompra(ev) {
    ev.preventDefault();
    const q = { marca: titulo($('#c-marca').value), modelo: $('#c-modelo').value.trim(), provincia: $('#c-prov').value,
      desde: +$('#c-desde').value || 0, hasta: +$('#c-hasta').value || 0 };
    if (!q.marca || !q.modelo) return;
    guardar('c-prov', q.provincia);
    const btn = $('#c-buscar'); btn.disabled = true; btn.textContent = 'Buscando…';
    $('#c-res').innerHTML = '<div class="vacio">Buscando en DeRuedas, Autocosmos y el stock de las agencias…</div>';
    try {
      const u = new URL(urlBuscador());
      Object.entries(q).forEach(([k, v]) => v && u.searchParams.set(k, v));
      const r = await (await fetch(u)).json();
      if (!r.ok) throw new Error(r.error || 'respuesta inválida');
      const fuentes = r.fuentes.map(f => ({ nombre: f.nombre, n: r.autos.filter(a => a.fuente === f.id).length, error: f.errores.length && !f.encontrados }));
      const locales = stockLocal(q);
      if (DATA) DATA.agencias.forEach(ag => fuentes.push({ nombre: ag.nombre, n: locales.filter(a => a.fuente === ag.id).length }));
      ultimo = { q, fuentes, autos: [...locales, ...r.autos] };
      mostrarResultados(ultimo);
    } catch (e) {
      $('#c-res').innerHTML = `<div class="vacio">No se pudo completar la búsqueda (${esc(e.message)}). Revisá la conexión o la URL del buscador.<br><button class="btn btn-ghost btn-sm" type="button" id="c-reconectar" style="margin-top:10px">Cambiar URL del buscador</button></div>`;
      const b = $('#c-reconectar'); if (b) b.onclick = () => { guardar('buscador', ''); pedirConexion(); };
    } finally { btn.disabled = false; btn.textContent = 'Buscar'; }
  }

  function mostrarResultados(res) {
    const p = P();
    const L = res.autos.map(a => ({ a, k: analizar(a, p) })).filter(x => x.k.ars != null)
      .sort((x, y) => (y.k.margen ?? -1e15) - (x.k.margen ?? -1e15));
    const precios = L.map(x => x.k.ars).sort((a, b) => a - b), refs = L.map(x => x.k.ref).filter(Boolean).sort((a, b) => a - b);
    const med = (v) => v.length ? v[Math.floor(v.length / 2)] : null;
    const buenas = L.filter(x => x.k.ratio != null && x.k.ratio <= 1).length;
    const titulo2 = `${res.q.marca} ${res.q.modelo}${res.q.desde || res.q.hasta ? ` ${res.q.desde || '…'}–${res.q.hasta || '…'}` : ''} · ${res.q.provincia || 'todo el país'}`;
    if (!L.length) { $('#c-res').innerHTML = `<div class="fuentes">${res.fuentes.map(f => `<span class="chip ${f.error ? 'bad' : ''}">${esc(f.nombre)} · ${f.error ? 'sin respuesta' : f.n}</span>`).join('')}</div><div class="vacio">No hay publicaciones con precio para ${esc(titulo2)}. Probá ampliar los años o buscar en todo el país.</div>`; return; }
    $('#c-res').innerHTML = `
      <div class="fuentes">${res.fuentes.map(f => `<span class="chip ${f.error ? 'bad' : f.n ? 'x5' : ''}">${esc(f.nombre)} · ${f.error ? 'sin respuesta' : f.n}</span>`).join('')}</div>
      <div class="resumen">
        <div><span>Publicados</span><b>${L.length}</b></div>
        <div><span>Precio mediano</span><b class="num">${mill(med(precios))}</b></div>
        <div><span>Guía mediana</span><b class="num">${mill(med(refs))}</b></div>
        <div><span>A guía o menos</span><b>${buenas}</b></div>
      </div>
      <div class="cuenta">${esc(titulo2)} · ordenado por margen para X5 (${p.regla === 'mayor' ? 'venta al mayor entre guía + ' + Math.round(p.pct * 100) + '% y agencia + %' : 'venta a guía + ' + Math.round(p.pct * 100) + '%'})</div>
      <div class="lista">${L.map(({ a, k }) => `
        <a class="fila" href="${esc(a.url)}" target="_blank" rel="noopener">
          <div class="foto">${img(a.foto, a.modelo)}</div>
          <div><div class="t">${esc(a.marca)} ${esc(a.modelo)} ${a.anio || ''}</div>
            <div class="s">${esc(a.version)}${a.km != null ? ' · ' + nf.format(a.km) + ' km' : ''}<br>${esc([a.localidad, a.provincia].filter(Boolean).join(', '))} · ${esc(a.fuenteNombre || (a.fuente === 'deruedas' ? 'DeRuedas' : 'Autocosmos'))}${a.vendedor && a.vendedor !== a.fuenteNombre ? ' · ' + esc(a.vendedor) : ''}</div>
            <div class="s num" style="margin-top:3px"><b>${a.moneda === 'USD' ? 'U$S ' + nf.format(a.precio) + ' ≈ ' : ''}${mill(k.ars)}</b></div></div>
          <div class="c-ag"><div class="k">Publicado</div><div class="v num">${mill(k.ars)}</div></div>
          <div class="c-guia"><div class="k">Guía</div><div class="v num">${mill(k.ref)}</div><div class="s">${k.g?.mejor ? esc(k.g.mejor.version) : k.g ? 'mediana de ' + k.g.n + ' versiones' : ''}</div></div>
          <div class="c-x5"><div class="k">Venta X5</div><div class="v num">${mill(k.venta)}</div>
            <div class="s num">${k.margen != null ? `<span class="${k.margen >= 0 ? 'pos' : 'neg'}">${k.margen >= 0 ? '+' : '−'}${mill(Math.abs(k.margen))}</span>` : ''}</div>${pill(k.ratio)}</div>
        </a>`).join('')}</div>`;
  }

  $('#f-compra').addEventListener('submit', buscarCompra);
  ['pct', 'usd'].forEach(id => $('#' + id).addEventListener('input', () => { if (vista === 'compra' && ultimo) mostrarResultados(ultimo); }));

  render();
  fetch('data/stock.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    DATA = d;
    d.agencias.forEach(a => AG[a.id] = a);
    $('#estado').innerHTML = d.agencias.map(a => `<span class="chip ${a.estado === 'ok' ? 'ok' : 'bad'}" title="${esc(a.detalle || '')}">${esc(a.nombre)} · ${a.autos} autos · ${a.estado === 'ok' ? 'leído ' + fecha(a.actualizado) : 'falló la lectura, se muestra el stock anterior'}</span>`).join('');
    const marcas = [...new Set(d.autos.map(a => a.marca).filter(Boolean))].sort();
    $('#marca').insertAdjacentHTML('beforeend', marcas.map(m => `<option>${esc(m)}</option>`).join(''));
    render();
  }).catch(() => { $('#v-cliente').innerHTML = '<div class="vacio">No se pudo cargar el stock. Revisá la conexión y volvé a abrir la página.</div>'; });
})();
</script>
</body>
</html>
