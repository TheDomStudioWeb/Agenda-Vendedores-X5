<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<title>Ingreso y egreso · X5 Cuyo</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="x5-theme.css">
<style>
  [hidden] { display: none !important; }
  #login { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: var(--bg-glow), var(--bg); }
  #login .tag { color: var(--muted); font-size: .8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; }
  #login .card { width: 100%; max-width: 360px; }
  #dl-host .dl{--dl-pill-a:#ff4a5c;--dl-pill-b:#b80f22;--dl-pill-tx:#fff;--dl-field:var(--surface-2);--dl-field-bd:var(--line-strong);--dl-tx:var(--text);--dl-mut:var(--muted);--dl-accent:var(--x5);--dl-ok:#2fd18a;--dl-bad:#ff6b61;font-family:var(--font)}
  #dl-host .dl-go{color:#fff}

  main { padding: 14px 14px calc(30px + var(--safe-bottom)); max-width: 620px; margin: 0 auto; }
  .reloj { text-align: center; padding: 18px 10px 8px; }
  .reloj .h { font-size: 3.6rem; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .reloj .h small { font-size: 1.4rem; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .reloj .d { color: var(--muted); font-weight: 600; margin-top: 8px; }
  .estado { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin: 14px 0; }
  .estado .pt { width: 14px; height: 14px; border-radius: 50%; background: var(--faint); flex: none; }
  .estado.adentro { border-color: rgba(47,209,138,.45); background: linear-gradient(135deg, rgba(47,209,138,.12), transparent 70%), var(--surface); }
  .estado.adentro .pt { background: var(--ok); box-shadow: 0 0 0 0 rgba(47,209,138,.6); animation: lat 1.8s infinite; }
  @keyframes lat { 70% { box-shadow: 0 0 0 12px rgba(47,209,138,0); } 100% { box-shadow: 0 0 0 0 rgba(47,209,138,0); } }
  .estado b { display: block; font-size: 1.02rem; }
  .estado span { color: var(--muted); font-size: .82rem; }
  .marcas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .marca { position: relative; overflow: hidden; border: 0; border-radius: 22px; min-height: 150px; padding: 18px 14px; color: #fff; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: transform .12s, opacity .2s, filter .2s; }
  .marca:active { transform: scale(.97); }
  .marca svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .marca b { font-size: 1.05rem; letter-spacing: .5px; text-transform: uppercase; }
  .marca small { opacity: .85; font-size: .74rem; font-weight: 600; }
  .marca.in { background: linear-gradient(160deg, #22b874, #138a54); box-shadow: 0 12px 28px rgba(19,138,84,.35); }
  .marca.out { background: linear-gradient(160deg, #ff4a5c, #b80f22); box-shadow: 0 12px 28px rgba(184,15,34,.35); }
  .marca:disabled { filter: grayscale(1); opacity: .32; box-shadow: none; cursor: not-allowed; }
  .marca .onda { position: absolute; border-radius: 50%; background: rgba(255,255,255,.45); transform: scale(0); animation: onda .7s ease-out forwards; pointer-events: none; }
  @keyframes onda { to { transform: scale(4); opacity: 0; } }

  .sem { margin-top: 22px; }
  .sem-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sem-h .t { flex: 1; text-align: center; }
  .sem-h .t b { display: block; font-size: .95rem; }
  .sem-h .t span { color: var(--muted); font-size: .76rem; }
  .sem-h button { width: 42px; min-width: 42px; }
  .total { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .total div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .total b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .total span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .dia { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .dia.hoy { border-color: var(--x5); }
  .dia.vacio { opacity: .55; }
  .dia-h { display: flex; justify-content: space-between; align-items: baseline; }
  .dia-h b { text-transform: capitalize; }
  .dia-h span { font-variant-numeric: tabular-nums; font-weight: 700; }
  .turno { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0 0; font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .turno .flecha { color: var(--faint); }
  .turno .ab { color: var(--ok); font-weight: 700; }
  .turno .nt { display: block; font-size: .7rem; color: var(--warn); }
  .turno button { background: none; border: 0; color: var(--x5-text); font: inherit; font-size: .76rem; font-weight: 700; cursor: pointer; padding: 4px 0 4px 8px; }
  .acciones { display: grid; gap: 8px; margin-top: 14px; }
  .ger { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 12px; }
  .ger select { width: 100%; }
  .adentro-l { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px)); max-height: 88vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dx-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dx-h h2 { margin: 0; font-size: 1.05rem; }
  .dx-b { padding: 14px 16px 18px; overflow: auto; max-height: calc(88vh - 60px); }
  .nota { color: var(--muted); font-size: .78rem; }
  .err { background: rgba(255,122,133,.12); color: var(--bad); border-radius: 10px; padding: 9px 11px; font-size: .85rem; margin: 8px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sig { margin-bottom: 14px; }
  .sig-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sig-h b { font-size: .86rem; }
  .sig-wrap { position: relative; border-radius: 14px; overflow: hidden; border: 1.5px dashed var(--line-strong); background: #fff; }
  .sig-wrap canvas { display: block; width: 100%; height: 150px; touch-action: none; }
  .sig-wrap span { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; color: #b5bcc6; font-size: .74rem; pointer-events: none; border-top: 1px solid #e3e7ec; margin: 0 24px; padding-top: 4px; }
  .foot { text-align: center; color: var(--faint); font-size: .7rem; margin: 26px 0 6px; line-height: 1.6; }
</style>
</head>
<body>

<div id="login">
  <img class="logo" src="brand/x5-logo-blanco.png" alt="X5 Argentina" style="width:112px;margin-bottom:10px">
  <div class="tag">Ingreso y egreso</div>
  <div class="card" id="login-box" hidden>
    <div id="dl-host"></div>
    <a href="index.html" class="btn btn-ghost" style="margin-top:10px">Volver al Hub</a>
  </div>
  <div id="login-loading" class="center muted"><span class="spinner"></span><p>Conectando…</p></div>
</div>

<header class="x5-top" id="top" hidden>
  <a class="x5-back" href="index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <img class="logo logo-mini" src="brand/x5-logo-blanco.png" alt="X5 Argentina">
  <div><h1>Ingreso y egreso</h1><div class="sub" id="quien"></div></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm" id="btn-act" title="Actualizar">↻</button>
  <button class="btn btn-ghost btn-sm" id="btn-salir" title="Cerrar sesión">Salir</button>
</header>

<main id="app" hidden>
  <div class="ger" id="ger" hidden>
    <label class="lbl" for="g-per">Ver el registro de</label>
    <select id="g-per"></select>
    <div class="adentro-l" id="g-adentro"></div>
  </div>

  <section id="propio">
    <div class="reloj"><div class="h" id="r-h">--:--</div><div class="d" id="r-d"></div></div>
    <div class="estado" id="est"><span class="pt"></span><div><b id="est-t">Cargando…</b><span id="est-s"></span></div></div>
    <div class="marcas">
      <button class="marca in" id="b-in" disabled><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><b>Ingreso</b><small>Marcar llegada</small></button>
      <button class="marca out" id="b-out" disabled><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><b>Salida</b><small>Marcar retiro</small></button>
    </div>
    <p class="nota center" style="margin-top:10px">La hora la registra el sistema, no el teléfono.</p>
  </section>

  <section class="sem">
    <div class="sem-h">
      <button class="btn btn-ghost btn-sm" id="s-ant" aria-label="Semana anterior">‹</button>
      <div class="t"><b id="s-t">Esta semana</b><span id="s-r"></span></div>
      <button class="btn btn-ghost btn-sm" id="s-sig" aria-label="Semana siguiente">›</button>
    </div>
    <div class="total"><div><b id="t-h">0:00</b><span>Horas de la semana</span></div><div><b id="t-d">0</b><span>Días trabajados</span></div></div>
    <div id="dias"></div>
    <div class="acciones">
      <button class="btn" id="b-pdf">Exportar semana en PDF</button>
      <button class="btn btn-ghost" id="b-man" hidden>Cargar un turno a mano</button>
    </div>
  </section>
  <div class="foot">Desarrollado por <span class="dom-sign">The DOM Studio Web</span> · WhatsApp 261-3431216 · thedomstudioweb@gmail.com</div>
</main>
<dialog id="dlg"></dialog>

<script src="x5-core.js"></script>
<script src="dom-login.js"></script>
<script>
(() => {
'use strict';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwd9HUXBTCrmuZKglXS7cvPa56RHW3LcQQuXz-OgaMzYVQvcTnUZDA-QOukvf0bWqTu/exec';
const $ = (id) => document.getElementById(id), esc = X5.esc, dlg = $('dlg');
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const ERR = { ya_adentro: 'Ya figura un ingreso sin salida. Marcá la salida primero.', sin_entrada: 'No hay un ingreso abierto para cerrar.', sin_permiso: 'No tenés permiso para esa acción.', falta_motivo: 'Escribí el motivo de la corrección.', falta_entrada: 'Falta la hora de ingreso.', falta_salida: 'Falta la hora de salida.', falta_fecha: 'Falta la fecha.', persona_invalida: 'Elegí una persona.' };
const DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
let user = null, token = null, D = null, desde = null, quien = null, desfase = 0, tic = null;

const post = async (b) => { const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, b)) }); return r.json(); };
const gerente = () => user.rol === 'Gerente Comercial', veTodo = () => gerente() || ['Supervisor', 'Director Comercial General'].includes(user.rol);
const hm = (min) => { min = Math.round(min || 0); return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); };
const hdec = (min) => (Math.round((min || 0) / 60 * 100) / 100).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const isoMas = (iso, n) => { const p = iso.split('-').map(Number); const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.toISOString().slice(0, 10); };
const ddmm = (iso) => { const p = iso.split('-'); return p[2] + '/' + p[1]; };
const ahora = () => new Date(Date.now() + desfase);

/* ── Ingreso (comparte la sesión del Hub) ── */
async function prepararLogin() {
  const s = store.get('x5_session');
  if (s && s.token) { token = s.token; user = s.user; return entrar(); }
  try {
    const r = await (await fetch(SCRIPT_URL + '?action=usuarios', { cache: 'no-store' })).json();
    $('login-loading').hidden = true; $('login-box').hidden = false;
    DomLogin.mount($('dl-host'), {
      campos: [
        { nombre: 'nombre', etiqueta: 'Usuario', tipo: 'select', vacio: 'Elegí tu usuario…', opciones: r.usuarios.map(u => u.nombre), valor: store.get('x5_ultimo_usuario') || '' },
        { nombre: 'clave', etiqueta: 'Clave', tipo: 'password', autocomplete: 'current-password' }
      ],
      boton: 'Ingresar', enviando: 'Verificando…', listo: 'Bienvenido',
      enviar: async ({ nombre, clave }) => {
        let r;
        try { r = await (await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', nombre, clave }) })).json(); }
        catch (e) { throw new Error('No se pudo verificar tu clave. Revisá la conexión.'); }
        if (!r.ok || !r.token) throw new Error({ clave_incorrecta: 'Clave incorrecta', demasiados_intentos: 'Demasiados intentos. Esperá 10 minutos.' }[r.error] || 'Usuario no habilitado');
        token = r.token; user = r.usuario; store.set('x5_session', { user, token }); store.set('x5_ultimo_usuario', nombre);
      },
      hecho: () => entrar()
    });
  } catch (e) { $('login-loading').innerHTML = '<p>No hay conexión. Probá de nuevo en un momento.</p><button class="btn" onclick="location.reload()">Reintentar</button>'; }
}
$('btn-salir').onclick = () => { store.del('x5_session'); location.reload(); };
$('btn-act').onclick = () => cargar(true);

async function entrar() {
  $('login').style.display = 'none'; $('top').hidden = false; $('app').hidden = false;
  $('quien').textContent = user.nombre + (user.rol === 'Personal' ? '' : ' · ' + user.rol);
  quien = user.nombre;
  $('b-man').hidden = !gerente();
  await cargar(false);
  clearInterval(tic); tic = setInterval(pintarReloj, 1000); pintarReloj();
}
async function cargar(manual) {
  try {
    const r = await post({ action: 'asistencia_datos', desde: desde || undefined, nombre: quien });
    if (r.error === 'sesion_vencida') { store.del('x5_session'); X5.toast('La sesión venció. Ingresá de nuevo.', 'bad', 4000); return setTimeout(() => location.reload(), 1500); }
    if (!r.ok) throw new Error(r.error);
    D = r; desde = r.desde; desfase = new Date(r.ahora).getTime() - Date.now();
    pintar(); if (manual) X5.toast('Actualizado', 'ok');
  } catch (e) { X5.toast(ERR[e.message] || 'No se pudo cargar. Revisá la conexión.', 'bad', 3500); }
}

/* ── Pantalla ── */
function pintarReloj() {
  const d = ahora();
  $('r-h').innerHTML = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }) + `<small>${String(d.getSeconds()).padStart(2, '0')}</small>`;
  const fd = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }); $('r-d').textContent = fd.charAt(0).toUpperCase() + fd.slice(1);
  if (D && D.abierto && quien === user.nombre) {
    const min = (d - new Date(D.abierto.entrada_ts)) / 60000;
    $('est-s').textContent = 'Desde las ' + D.abierto.entrada + ' · ' + hm(min) + ' h trabajando';
  }
}
function pintar() {
  const propio = quien === user.nombre;
  $('propio').hidden = !propio || ['Supervisor', 'Director Comercial General'].includes(user.rol);
  const ab = D.abierto;
  $('est').classList.toggle('adentro', !!ab);
  $('est-t').textContent = ab ? 'Estás adentro' : 'Estás afuera';
  $('est-s').textContent = ab ? 'Desde las ' + ab.entrada : 'Tocá «Ingreso» al llegar';
  $('b-in').disabled = !!ab; $('b-out').disabled = !ab;
  // gerencia y supervisión
  if (veTodo()) {
    $('ger').hidden = false;
    const per = (D.personas || []).slice(); if (!per.includes(user.nombre)) per.unshift(user.nombre);
    $('g-per').innerHTML = per.map(n => `<option ${n === quien ? 'selected' : ''}>${esc(n)}</option>`).join('');
    $('g-adentro').innerHTML = (D.adentro || []).length ? (D.adentro.map(a => `<span class="chip ok">● ${esc(a.nombre)} · desde ${esc(a.desde)}</span>`).join('')) : '<span class="nota">Nadie marcó ingreso sin salida.</span>';
  }
  // semana
  const hoy = D.hoy, esta = hoy >= D.desde && hoy <= D.hasta;
  $('s-t').textContent = esta ? 'Esta semana' : (D.desde > hoy ? 'Semana próxima' : 'Semana del ' + ddmm(D.desde));
  $('s-r').textContent = 'Lunes ' + ddmm(D.desde) + ' al domingo ' + ddmm(D.hasta) + (propio ? '' : ' · ' + D.nombre);
  $('s-sig').disabled = esta;
  const porDia = {}; D.semana.forEach(r => (porDia[r.fecha] = porDia[r.fecha] || []).push(r));
  let total = 0, dias = 0;
  $('dias').innerHTML = DIAS.map((nom, i) => {
    const f = isoMas(D.desde, i), ts = porDia[f] || [];
    const min = ts.reduce((t, r) => t + (r.salida ? Number(r.minutos) || 0 : 0), 0); total += min; if (ts.length) dias++;
    return `<div class="dia ${f === hoy ? 'hoy' : ''} ${ts.length ? '' : 'vacio'}"><div class="dia-h"><b>${nom} ${ddmm(f)}</b><span>${ts.length ? hm(min) + ' h' : '—'}</span></div>
      ${ts.map(r => `<div class="turno"><div>${esc(r.entrada)} <span class="flecha">→</span> ${r.salida ? esc(r.salida) : '<span class="ab">en curso</span>'}${r.nota ? `<span class="nt">${esc(r.nota)}</span>` : ''}</div>
        <div>${r.salida ? hm(r.minutos) + ' h' : ''}${gerente() ? ` <button data-ed="${esc(r.id)}">Corregir</button>` : ''}</div></div>`).join('')}</div>`;
  }).join('');
  $('t-h').textContent = hm(total); $('t-d').textContent = dias;
  const fin = hoy > D.hasta || (esta && new Date().getDay() === 6) || (esta && new Date().getDay() === 0);
  $('b-pdf').textContent = fin ? 'Exportar semana completa en PDF' : 'Exportar semana en PDF (hasta hoy)';
}
$('g-per').onchange = () => { quien = $('g-per').value; cargar(false); };
$('s-ant').onclick = () => { desde = isoMas(desde, -7); cargar(false); };
$('s-sig').onclick = () => { desde = isoMas(desde, 7); cargar(false); };

/* ── Marcar ── */
function onda(btn, e) { const r = btn.getBoundingClientRect(), s = document.createElement('span'); s.className = 'onda'; const t = Math.max(r.width, r.height); s.style.cssText = `width:${t}px;height:${t}px;left:${(e.clientX || r.left + r.width / 2) - r.left - t / 2}px;top:${(e.clientY || r.top + r.height / 2) - r.top - t / 2}px`; btn.appendChild(s); setTimeout(() => s.remove(), 700); }
function confirmar(tipo, e) {
  onda(tipo === 'entrada' ? $('b-in') : $('b-out'), e);
  const h = ahora().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  dialogo(tipo === 'entrada' ? 'Marcar ingreso' : 'Marcar salida', `<p style="font-size:1.05rem">¿Confirmás tu <b>${tipo === 'entrada' ? 'ingreso' : 'salida'}</b> a las <b>${h}</b>?</p>
    <div class="grid2" style="margin-top:14px"><button class="btn btn-ghost" id="c-no">Cancelar</button><button class="btn" id="c-si">Confirmar</button></div>`);
  $('c-no').onclick = () => dlg.close();
  $('c-si').onclick = async (ev) => {
    ev.target.disabled = true; ev.target.textContent = 'Registrando…';
    try {
      const r = await post({ action: 'asistencia_marcar', tipo });
      if (!r.ok) throw new Error(r.error);
      dlg.close();
      if (navigator.vibrate) navigator.vibrate(60);
      X5.toast(tipo === 'entrada' ? '✓ Ingreso registrado a las ' + r.registro.entrada : '✓ Salida registrada a las ' + r.registro.salida + ' · ' + hm(r.registro.minutos) + ' h', 'ok', 4000);
      if (r.revisar) X5.toast('El turno quedó marcado para revisar (salida muy tarde).', 'bad', 5000);
      await cargar(false);
    } catch (err) { dlg.close(); X5.toast(err.message === 'Failed to fetch' ? 'Sin conexión: no se registró. Probá de nuevo.' : (ERR[err.message] || 'No se pudo registrar. Probá de nuevo.'), 'bad', 4500); cargar(false); }
  };
}
$('b-in').onclick = (e) => confirmar('entrada', e);
$('b-out').onclick = (e) => confirmar('salida', e);
function dialogo(titulo, html) { dlg.innerHTML = `<div class="dx-h"><h2>${esc(titulo)}</h2><button type="button" class="btn btn-ghost btn-sm" id="dx-x" aria-label="Cerrar">✕</button></div><div class="dx-b">${html}</div>`; $('dx-x').onclick = () => dlg.close(); if (!dlg.open) dlg.showModal(); }

/* ── Correcciones (solo gerencia) ── */
document.addEventListener('click', (e) => { const b = e.target.closest('[data-ed]'); if (b) editar(b.dataset.ed); });
function formTurno(r) {
  return `<div class="field"><label for="e-f">Fecha</label><input id="e-f" type="date" value="${esc(r ? r.fecha : D.hoy)}"></div>
    <div class="grid2"><div class="field"><label for="e-in">Ingreso</label><input id="e-in" type="time" value="${esc(r ? r.entrada : '')}"></div><div class="field"><label for="e-out">Salida</label><input id="e-out" type="time" value="${esc(r ? r.salida : '')}"></div></div>
    <div class="field"><label for="e-m">Motivo (queda registrado)</label><input id="e-m" maxlength="200" placeholder="Ej.: se olvidó de marcar la salida"></div><div id="e-err"></div>`;
}
async function enviarCorreccion(body, btn) {
  btn.disabled = true;
  try { const r = await post(Object.assign({ action: 'asistencia_corregir' }, body)); if (!r.ok) throw new Error(r.error); dlg.close(); X5.toast('Guardado ✓', 'ok'); cargar(false); }
  catch (err) { btn.disabled = false; $('e-err').innerHTML = `<div class="err">${esc(ERR[err.message] || 'No se pudo guardar.')}</div>`; }
}
function editar(id) {
  const r = D.semana.find(x => x.id === id); if (!r) return;
  dialogo('Corregir turno · ' + D.nombre, formTurno(r) + `<button class="btn" id="e-ok">Guardar corrección</button><button class="btn btn-danger" id="e-del" style="margin-top:8px">Borrar este turno</button>`);
  $('e-ok').onclick = (ev) => enviarCorreccion({ id, fecha: $('e-f').value, entrada: $('e-in').value, salida: $('e-out').value, motivo: $('e-m').value }, ev.target);
  $('e-del').onclick = (ev) => { if (!$('e-m').value.trim()) { $('e-err').innerHTML = '<div class="err">Escribí el motivo para borrar.</div>'; return; } enviarCorreccion({ id, borrar: true, motivo: $('e-m').value }, ev.target); };
}
$('b-man').onclick = () => {
  dialogo('Cargar turno a mano · ' + quien, formTurno(null) + '<button class="btn" id="e-ok">Guardar turno</button>');
  $('e-ok').onclick = (ev) => enviarCorreccion({ nombre: quien, fecha: $('e-f').value, entrada: $('e-in').value, salida: $('e-out').value, motivo: $('e-m').value }, ev.target);
};

/* ── PDF de la semana (para quien cuenta las horas) ── */
const cargarScript = (src, glob) => new Promise((res, rej) => { if (window[glob]) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function pdfSemana(firmas) {

  const derecha = (s, x, y, o = {}) => { const fo = o.bold ? fb : f; txt(s, x - fo.widthOfTextAtSize(String(s), o.size || 10), y, o); };

  pg.drawRectangle({ x: 0, y: 841.89 - 100, width: W, height: 4, color: ROJO });
  try { const png = await (await fetch('brand/x5-logo-blanco.png')).arrayBuffer(); const im = await doc.embedPng(png); const h = 44, w = im.width / im.height * h; pg.drawImage(im, { x: M, y: 841.89 - 72, width: w, height: h }); } catch (e) {}
  derecha('REGISTRO DE ASISTENCIA', W - M, 841.89 - 46, { bold: true, size: 15, color: rgb(1, 1, 1) });
  derecha('X5 Argentina · Mendoza', W - M, 841.89 - 64, { size: 9.5, color: rgb(.78, .79, .8) });
  let y = 841.89 - 140;
  txt('Persona', M, y, { size: 8.5, color: GRIS }); txt('Semana', 300, y, { size: 8.5, color: GRIS });
  y -= 16; txt(D.nombre, M, y, { bold: true, size: 13 }); txt('Lunes ' + X5.fechaLarga(D.desde) + ' al domingo ' + X5.fechaLarga(D.hasta), 300, y, { bold: true, size: 11 });
  y -= 30;
  // Tabla

  pg.drawRectangle({ x: M, y: y - 6, width: W - 2 * M, height: 22, color: FONDO });
  ['DÍA', 'FECHA', 'INGRESO', 'SALIDA', 'HORAS', 'OBSERVACIONES'].forEach((h, i) => txt(h, cols[i] + 6, y + 1, { bold: true, size: 8, color: GRIS }));
  y -= 24;
  const porDia = {}; D.semana.forEach(r => (porDia[r.fecha] = porDia[r.fecha] || []).push(r));
  let total = 0, dias = 0, enCurso = 0;
  const cortar = (s, ancho, size) => { const pal = String(s).split(' '); const ls = []; let cur = ''; pal.forEach(p => { const t = cur ? cur + ' ' + p : p; if (f.widthOfTextAtSize(t, size) > ancho && cur) { ls.push(cur); cur = p; } else cur = t; }); if (cur) ls.push(cur); return ls; };
  DIAS.forEach((nom, i) => {
    const fch = isoMas(D.desde, i), ts = porDia[fch] || [];
    const filas = ts.length ? ts : [null];
    filas.forEach((r, j) => {
      const notas = r && r.nota ? cortar(r.nota, W - M - cols[5] - 10, 7.5).slice(0, 3) : [];
      const alto = Math.max(20, 12 + notas.length * 9);
      if (j === 0) { txt(nom.charAt(0).toUpperCase() + nom.slice(1), cols[0] + 6, y, { bold: true, size: 9.5 }); txt(ddmm(fch), cols[1] + 6, y, { size: 9.5 }); }
      if (r) {

  pg.drawRectangle({ x: M, y: y - 30, width: W - 2 * M, height: 44, color: FONDO, borderColor: ROJO, borderWidth: 1 });
  txt('TOTAL DE LA SEMANA', M + 12, y - 4, { bold: true, size: 9, color: GRIS });

  derecha(hm(total) + ' h', W - M - 12, y - 6, { bold: true, size: 18 });
  derecha('(' + hdec(total) + ' horas)', W - M - 12, y - 22, { size: 9, color: GRIS });
  y -= 52;
  if (enCurso) { txt('Hay ' + enCurso + ' turno' + (enCurso === 1 ? '' : 's') + ' sin salida registrada: no suma' + (enCurso === 1 ? '' : 'n') + ' horas hasta que se corrija.', M, y, { size: 8.5, color: ROJO }); y -= 16; }
  txt('Las horas de ingreso y salida las registró el servidor del Hub en el momento de marcar. Las correcciones indican quién las hizo y por qué.', M, y, { size: 7.5, color: GRIS });
  // Firmas
  const yf = 150;
  const anchoF = W / 2 - M - 20;
  for (const [x, t, fi] of [[M, 'Firma de quien informa las horas', firmas.empleado], [W / 2 + 20, 'Firma del responsable', firmas.responsable]]) {
    if (fi && fi.png) {

    }

    txt(t, x, yf - 14, { size: 8.5, color: GRIS });

    if (fi && fi.png) txt('Firmado en el teléfono el ' + new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }), x, yf - 39, { size: 7, color: GRIS });
  }
  // Pie
  const gen = new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  txt('Generado el ' + gen + ' por ' + user.nombre + ' · Hub Comercial X5 Cuyo', M, 70, { size: 7.5, color: GRIS });
  pg.drawLine({ start: { x: M, y: 56 }, end: { x: W - M, y: 56 }, thickness: .5, color: LINEA });
  txt('Desarrollado por The DOM Studio Web · WhatsApp 261-3431216 · thedomstudioweb@gmail.com', M, 42, { size: 7.5, color: GRIS });
  const bytes = await doc.save();
  return new Blob([bytes], { type: 'application/pdf' });
}
/* ── Firmas en el teléfono (como en X5 Check) ── */
function padFirma(cv) {
  const g = cv.getContext('2d'); let firmado = false, dib = false, last = null;
  const r = cv.getBoundingClientRect(), dpr = Math.max(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0d1b2a';
  const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); dib = true; last = pos(e); firmado = true; e.preventDefault(); });
  cv.addEventListener('pointermove', (e) => { if (!dib) return; const p = pos(e), mid = [(last[0] + p[0]) / 2, (last[1] + p[1]) / 2]; g.beginPath(); g.moveTo(last[0], last[1]); g.quadraticCurveTo(last[0], last[1], mid[0], mid[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { dib = false; }));
  return {
    firmado: () => firmado,
    borrar: () => { g.clearRect(0, 0, cv.width, cv.height); firmado = false; },
    png: async () => {
      if (!firmado) return null;
      // recorta al trazo para que la firma salga grande en el PDF
      const d = g.getImageData(0, 0, cv.width, cv.height).data; let x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0;
      for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) if (d[(y * cv.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0) return null;
      const pad = 12, c2 = document.createElement('canvas'); c2.width = x1 - x0 + pad * 2; c2.height = y1 - y0 + pad * 2;
      c2.getContext('2d').drawImage(cv, x0 - pad, y0 - pad, c2.width, c2.height, 0, 0, c2.width, c2.height);
      const b = await new Promise(res => c2.toBlob(res, 'image/png')); return new Uint8Array(await b.arrayBuffer());
    }
  };
}
$('b-pdf').onclick = () => {

};
async function exportar(firmas) {

  try {

    const nombre = 'Asistencia ' + D.nombre + ' ' + D.desde + '.pdf';
    await X5.compartirArchivo(blob, nombre, 'Registro de asistencia de ' + D.nombre + ', semana del ' + X5.fechaLarga(D.desde) + ' al ' + X5.fechaLarga(D.hasta));
