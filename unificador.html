<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<title>Gestor Documental · X5 Cuyo</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="x5-theme.css">
<script src="libs/pdf-lib.min.js"></script>
<style>
  .capture { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cap-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px 10px; border-radius: 16px; border: 1px dashed var(--line-strong); background: var(--surface-2); color: var(--text); font-weight: 700; font-size: .9rem; cursor: pointer; text-align: center; }
  .cap-btn svg { width: 30px; height: 30px; stroke: var(--x5); fill: none; stroke-width: 1.7; }
  .cap-btn.dom svg { stroke: var(--dom); }
  .cap-btn small { font-weight: 500; color: var(--muted); font-size: .72rem; }
  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 10px; }
  .pg { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
  .pg .thumb { aspect-ratio: 210 / 297; border-radius: 8px; background: #fff center/contain no-repeat; display: grid; place-items: center; color: #444; font-weight: 800; font-size: .8rem; }
  .pg .thumb.pdf { background: linear-gradient(160deg, #fff, #eef1f4); }
  .pg .n { position: absolute; top: 10px; left: 10px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--x5); color: var(--on-accent); font-size: .7rem; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
  .pg .tools { display: flex; justify-content: space-between; margin-top: 6px; }
  .pg .tools button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: var(--surface-3); color: var(--text); font-size: .85rem; cursor: pointer; }
  .pg .tools button.del { color: var(--bad); }
  .result { display: none; }
  .result.show { display: block; }
  .tip-box { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--x5-soft); color: var(--text); font-size: .8rem; line-height: 1.4; }
</style>
</head>
<body>
<header class="x5-top">
  <a class="x5-back" href="index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <img class="logo logo-mini" src="brand/x5-logo-blanco.png" alt="X5 Argentina">
  <div><h1>Gestor Documental</h1><div class="sub">Escaneo y unificación de legajos en PDF</div></div>
</header>

<main class="x5-wrap">
  <section class="card">
    <div class="field"><label for="nombre">Nombre del legajo</label><input id="nombre" placeholder="Ej: Juan Pérez" autocomplete="off"></div>
    <div class="capture">
      <label class="cap-btn"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>Escanear<small>Abre la cámara</small>
        <input type="file" id="in-cam" accept="image/*" capture="environment" hidden></label>
      <label class="cap-btn dom"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>Agregar archivos<small>Fotos o PDFs</small>
        <input type="file" id="in-files" accept="image/*,application/pdf" multiple hidden></label>
    </div>
    <label class="seguir" style="display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.88rem"><input type="checkbox" id="seguir" checked style="width:20px;height:20px;accent-color:var(--x5)"><span>Abrir la cámara de nuevo después de cada página. Para terminar, cerrá la cámara sin sacar foto.</span></label>
    <div class="tip-box" style="margin-top:12px"><span>💡</span><span>Apoyá la hoja sobre una superficie oscura y con buena luz: el escáner detecta los bordes solo y endereza la página.</span></div>
  </section>

  <section class="card" id="sec-pages" hidden>
    <div class="card-title"><span><span class="dot"></span>Páginas del legajo</span><span class="chip x5" id="count">0</span></div>
    <div class="pages" id="pages"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-ghost" id="btn-clear">Vaciar</button>
      <button class="btn btn-dom" id="btn-make">Generar PDF</button>
    </div>
  </section>

  <section class="card result" id="result">
    <div class="card-title"><span><span class="dot" style="background:var(--ok)"></span>Legajo listo</span><span class="chip ok" id="size"></span></div>
    <p class="muted" style="margin:0 0 12px;font-size:.86rem" id="res-name"></p>
    <div class="row"><button class="btn btn-ghost" id="btn-save">Guardar</button><button class="btn" id="btn-share">Compartir</button></div>
  </section>
</main>

<script src="x5-core.js"></script>
<script src="x5-scanner.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const { PDFDocument } = PDFLib;
let items = []; // { tipo: 'img'|'pdf', blob, url, w, h, nombre, paginas }
let pdfFinal = null;

const p = new URLSearchParams(location.search);
if (p.get('cliente')) $('nombre').value = p.get('cliente');

async function agregarImagen(file, desdeCamara) {
  // alUsar corre en el mismo toque de "Usar": así el navegador deja reabrir la cámara sin otro toque
  const canvas = await X5Scanner.abrir(file, { titulo: `Página ${items.length + 1}`, filtro: 'color',
    alUsar: desdeCamara ? () => { if ($('seguir').checked) $('in-cam').click(); } : null });
  if (!canvas) return false;
  const { blob, width, height } = await X5.comprimir(canvas, 2000, 0.82);
  items.push({ tipo: 'img', blob, url: URL.createObjectURL(blob), w: width, h: height });
  render();
  return true;
}

async function agregarPdf(file) {
  try {
    const doc = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    items.push({ tipo: 'pdf', blob: file, nombre: file.name, paginas: doc.getPageCount() });
    render();
  } catch (e) { X5.toast(`No se pudo leer ${file.name}`, 'bad'); }
}

async function procesar(files) {
  for (const f of files) {
    if (f.type === 'application/pdf') await agregarPdf(f);
    else if (f.type.startsWith('image/')) await agregarImagen(f);
  }
}
const SEGUIR_LS = 'x5_escaner_seguir';
try { if (localStorage.getItem(SEGUIR_LS) === '0') $('seguir').checked = false; } catch (e) {}
$('seguir').addEventListener('change', () => { try { localStorage.setItem(SEGUIR_LS, $('seguir').checked ? '1' : '0'); } catch (e) {} });
// Varias páginas seguidas: tras guardar una página se vuelve a abrir la cámara. Si se cancela el escáner, se corta.
let cola = Promise.resolve();
$('in-cam').addEventListener('change', (e) => {
  const f = [...e.target.files]; e.target.value = '';
  cola = cola.then(async () => { for (const x of f) await agregarImagen(x, true); });
});
$('in-files').addEventListener('change', async (e) => { const f = [...e.target.files]; e.target.value = ''; await procesar(f); });

function render() {
  pdfFinal = null; $('result').classList.remove('show');
  $('sec-pages').hidden = !items.length;
  const total = items.reduce((s, it) => s + (it.tipo === 'pdf' ? it.paginas : 1), 0);
  $('count').textContent = `${total} ${total === 1 ? 'página' : 'páginas'}`;
  let n = 1;
  $('pages').innerHTML = items.map((it, i) => {
    const num = it.tipo === 'pdf' ? (it.paginas > 1 ? `${n}–${n + it.paginas - 1}` : n) : n;
    n += it.tipo === 'pdf' ? it.paginas : 1;
    return `<div class="pg">
      <span class="n">${num}</span>
      ${it.tipo === 'img' ? `<div class="thumb" style="background-image:url(${it.url})"></div>` : `<div class="thumb pdf">PDF<br><small style="font-weight:500">${it.paginas} pág.</small></div>`}
      <div class="tools">
        <button data-a="up" data-i="${i}" aria-label="Mover antes" ${i === 0 ? 'disabled' : ''}>◀</button>
        <button data-a="del" data-i="${i}" class="del" aria-label="Quitar">✕</button>
        <button data-a="down" data-i="${i}" aria-label="Mover después" ${i === items.length - 1 ? 'disabled' : ''}>▶</button>
      </div></div>`;
  }).join('');
}

$('pages').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const i = +b.dataset.i, a = b.dataset.a;
  if (a === 'del') { const [x] = items.splice(i, 1); if (x.url) URL.revokeObjectURL(x.url); }
  if (a === 'up' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
  if (a === 'down' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
  render();
});
$('btn-clear').addEventListener('click', () => { if (confirm('¿Quitar todas las páginas?')) { items.forEach(x => x.url && URL.revokeObjectURL(x.url)); items = []; render(); } });

const A4 = [595.28, 841.89];
$('btn-make').addEventListener('click', async () => {
  const btn = $('btn-make'); btn.disabled = true; btn.textContent = 'Armando PDF…';
  try {
    const out = await PDFDocument.create();
    for (const it of items) {
      if (it.tipo === 'pdf') {
        const src = await PDFDocument.load(await it.blob.arrayBuffer(), { ignoreEncryption: true });
        (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg));
      } else {
        const img = await out.embedJpg(await it.blob.arrayBuffer());
        const apaisada = img.width > img.height;
        const [W, H] = apaisada ? [A4[1], A4[0]] : A4;
        const pg = out.addPage([W, H]);
        const m = 18, d = img.scaleToFit(W - m * 2, H - m * 2);
        pg.drawImage(img, { x: (W - d.width) / 2, y: (H - d.height) / 2, width: d.width, height: d.height });
      }
    }
    out.setTitle(`Legajo ${$('nombre').value || ''}`.trim()); out.setProducer('X5 Cuyo · Hub Comercial');
    pdfFinal = new Blob([await out.save()], { type: 'application/pdf' });
    const nombre = `Legajo_${X5.slug($('nombre').value || 'X5')}_${X5.hoyISO()}.pdf`;
    pdfFinal.nombre = nombre;
    $('res-name').textContent = nombre;
    $('size').textContent = (pdfFinal.size / 1048576).toFixed(1).replace('.', ',') + ' MB';
    $('result').classList.add('show');
    $('result').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    console.error(e); X5.toast('Error al armar el PDF', 'bad');
  } finally { btn.disabled = false; btn.textContent = 'Generar PDF'; }
});
$('btn-save').addEventListener('click', () => pdfFinal && X5.guardarArchivo(pdfFinal, pdfFinal.nombre).then(() => X5.toast('PDF guardado', 'ok')));
$('btn-share').addEventListener('click', () => pdfFinal && X5.compartirArchivo(pdfFinal, pdfFinal.nombre, `Legajo ${$('nombre').value}`));
})();
</script>
</body>
</html>
