<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<title>Validador Documental · X5 Cuyo</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="x5-theme.css">
<script src="libs/pdf-lib.min.js"></script>
<style>
  .slots { display: grid; gap: 12px; }
  .slot { position: relative; aspect-ratio: 85.6 / 54; border-radius: 16px; border: 1.5px dashed var(--line-strong); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; cursor: pointer; }
  .slot svg { width: 34px; height: 34px; stroke: var(--x5); fill: none; stroke-width: 1.6; }
  .slot b { font-size: .95rem; } .slot small { color: var(--muted); font-size: .75rem; }
  .slot.done { border-style: solid; border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: #fff center/contain no-repeat; }
  .slot.done > * { display: none; }
  .slot .redo { display: none; position: absolute; right: 10px; bottom: 10px; }
  .slot.done .redo { display: inline-flex; }
  .slot .tag { position: absolute; left: 10px; top: 10px; }
  .slot.done .tag { display: inline-flex; }
  .src { display: flex; gap: 8px; margin-top: 8px; }
  .sheet-preview { background: #fff; aspect-ratio: 210/297; border-radius: 8px; box-shadow: var(--shadow); width: 100%; max-width: 300px; margin: 0 auto; display: block; }
</style>
</head>
<body>
<header class="x5-top">
  <a class="x5-back" href="index.html" aria-label="Volver al Hub"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <img class="logo logo-mini" src="brand/x5-logo-blanco.png" alt="X5 Argentina">
  <div><h1>Validador Documental</h1><div class="sub">DNI frente y dorso en una hoja A4</div></div>
</header>

<main class="x5-wrap">
  <section class="card">
    <div class="field"><label for="titular">Titular (opcional)</label><input id="titular" placeholder="Nombre y apellido" autocomplete="off"></div>
    <div class="slots">
      <div>
        <div class="slot" data-lado="0"><span class="chip ok tag">Frente</span>
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.5"/><path d="M13 10h5M13 14h3"/></svg><b>Frente del DNI</b><small>Tocá para fotografiar</small>
          <button class="btn btn-ghost btn-sm redo" type="button">Rehacer</button></div>
      </div>
      <div>
        <div class="slot" data-lado="1"><span class="chip ok tag">Dorso</span>
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 15h14M5 12h14M5 9h6"/></svg><b>Dorso del DNI</b><small>Tocá para fotografiar</small>
          <button class="btn btn-ghost btn-sm redo" type="button">Rehacer</button></div>
      </div>
    </div>
    <div class="src">
      <button class="btn btn-ghost btn-sm" style="flex:1" id="btn-galeria">Elegir de la galería</button>
    </div>
    <input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="in-gal" accept="image/*" hidden>
  </section>

  <section class="card" id="sec-out" hidden>
    <div class="card-title"><span><span class="dot"></span>Hoja final</span></div>
    <div class="seg" id="seg-tam" style="margin-bottom:14px">
      <button data-v="grande" class="active">Ampliado</button>
      <button data-v="real">Tamaño real</button>
    </div>
    <canvas id="preview" class="sheet-preview" width="420" height="594"></canvas>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-ghost" id="btn-save">Guardar PDF</button>
      <button class="btn" id="btn-share">Compartir</button>
    </div>
  </section>
</main>

<script src="x5-core.js"></script>
<script src="x5-scanner.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const lados = [null, null]; // canvas recortados
let objetivo = 0, tam = 'grande';

const slots = [...document.querySelectorAll('.slot')];
slots.forEach(s => s.addEventListener('click', () => { objetivo = +s.dataset.lado; $('in-cam').click(); }));
$('btn-galeria').addEventListener('click', () => { objetivo = lados[0] ? (lados[1] ? 0 : 1) : 0; $('in-gal').click(); });

async function cargar(file) {
  let c = await X5Scanner.abrir(file, { titulo: objetivo ? 'Dorso del DNI' : 'Frente del DNI', filtro: 'color' });
  if (!c) return;
  if (c.height > c.width) { // la tarjeta siempre apaisada
    const r = document.createElement('canvas'); r.width = c.height; r.height = c.width;
    const g = r.getContext('2d'); g.translate(r.width / 2, r.height / 2); g.rotate(-Math.PI / 2); g.drawImage(c, -c.width / 2, -c.height / 2); c = r;
  }
  lados[objetivo] = c;
  slots[objetivo].classList.add('done');
  slots[objetivo].style.backgroundImage = `url(${c.toDataURL('image/jpeg', .7)})`;
  if (objetivo === 0 && !lados[1]) { objetivo = 1; X5.toast('Ahora el dorso', '', 1800); }
  actualizar();
}
['in-cam', 'in-gal'].forEach(id => $(id).addEventListener('change', async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) await cargar(f); }));

$('seg-tam').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; tam = b.dataset.v;
  $('seg-tam').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b)); actualizar();
});

// Ubicación de cada cara en mm sobre A4 (210 × 297)
function cajas() {
  const w = tam === 'real' ? 85.6 : 170, h = w * 54 / 85.6, x = (210 - w) / 2;
  const gap = tam === 'real' ? 20 : 18, total = h * 2 + gap, y0 = (297 - total) / 2;
  return [{ x, y: y0, w, h }, { x, y: y0 + h + gap, w, h }];
}

function actualizar() {
  $('sec-out').hidden = !lados[0];
  if (!lados[0]) return;
  const cv = $('preview'), g = cv.getContext('2d'), k = cv.width / 210;
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  cajas().forEach((b, i) => {
    if (lados[i]) g.drawImage(lados[i], b.x * k, b.y * k, b.w * k, b.h * k);
    else { g.strokeStyle = '#ccc'; g.setLineDash([6, 6]); g.strokeRect(b.x * k, b.y * k, b.w * k, b.h * k); g.setLineDash([]); }
  });
}

async function armarPDF() {
  const { PDFDocument } = PDFLib;
  const pdf = await PDFDocument.create();
  const mm = 72 / 25.4, page = pdf.addPage([210 * mm, 297 * mm]);
  const bs = cajas();
  for (let i = 0; i < 2; i++) {
    if (!lados[i]) continue;
    const { blob } = await X5.comprimir(lados[i], 1600, 0.88);
    const img = await pdf.embedJpg(await blob.arrayBuffer());
    const b = bs[i];
    page.drawImage(img, { x: b.x * mm, y: (297 - b.y - b.h) * mm, width: b.w * mm, height: b.h * mm });
  }
  pdf.setTitle('DNI ' + ($('titular').value || '')); pdf.setProducer('X5 Cuyo · Hub Comercial');
  const blob = new Blob([await pdf.save()], { type: 'application/pdf' });
  return { blob, nombre: `DNI_${X5.slug($('titular').value || 'titular')}_${X5.hoyISO()}.pdf` };
}

$('btn-save').addEventListener('click', async () => {
  if (!lados[1] && !confirm('Falta el dorso. ¿Generar solo con el frente?')) return;
  const { blob, nombre } = await armarPDF(); await X5.guardarArchivo(blob, nombre); X5.toast('PDF guardado', 'ok');
});
$('btn-share').addEventListener('click', async () => {
  if (!lados[1] && !confirm('Falta el dorso. ¿Generar solo con el frente?')) return;
  const { blob, nombre } = await armarPDF(); await X5.compartirArchivo(blob, nombre, 'DNI ' + $('titular').value);
});
})();
</script>
</body>
</html>
