name: Sondeo fuentes de compra
on:
  push:
    branches: [sondeo-compras]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: radar-usados, path: sitio }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: (cd sitio && python3 -m http.server 8080 &) && sleep 2 && node sondeo/capturas.mjs
      - if: always()
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add sondeo/capturas && git commit -m "Sondeo: capturas para el manual" && git push
