name: Guía de precios CCA
# Cada mes: subí el PDF de la guía a la carpeta radar/guia/ con el nombre cca-AAAA-MM.pdf (ej. cca-2026-11.pdf).
# Este proceso lo convierte, actualiza el Simulador y el Radar, y guarda todo en el Hub.
on:
  push:
    branches: [main, radar-usados]
    paths: ['radar/guia/*.pdf', 'radar/scraper/guia_cca.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar-usados
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install pdfplumber==0.11.4
      - name: Convertir la guía más reciente
        run: python radar/scraper/guia_cca.py "$(ls radar/guia/cca-*.pdf | sort | tail -1)"
      - name: Recalcular el Radar con la guía nueva
        run: node radar/scraper/actualizar.mjs || true
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar/data
          git diff --cached --quiet && exit 0
          git commit -m "Guía CCA: datos actualizados"
          git pull --rebase
          git push
